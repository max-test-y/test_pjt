<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세상의 모든 점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f5ecdc;
    --surface: #fffaf1;
    --surface-2: #f1e4cc;
    --ink: #3b2a1a;
    --muted: #7a6650;
    --line: #e6d3b3;
    --focus: #b5772f;
    --accent: #b5772f;
    --good: #1f8a5a;
    --bad: #c8463d;
    --scrim: rgba(59, 42, 26, .35);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); position: relative; min-height: 100vh; overflow-x: hidden;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  button { font: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(1100px 650px at 85% -10%, rgba(214, 160, 90, .22), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, rgba(160, 90, 40, .12), transparent 60%),
      var(--bg);
  }
  .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 64px 20px 64px; text-align: center; }
  h1 {
    margin: 0 auto 14px; font-size: clamp(40px, 8vw, 84px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.02;
    background: linear-gradient(100deg, #3b2a1a 0%, #8a4a1f 50%, #c48a3e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin: 0 auto; max-width: 31em; color: var(--muted); font-size: 17px; text-wrap: balance; }

  .search { position: relative; max-width: 520px; margin: 26px auto 0; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    padding: 14px 44px 14px 46px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .82); box-shadow: 0 6px 24px rgba(90, 60, 25, .08);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(181, 119, 47, .14); }
  .search .ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 17px; opacity: .65; pointer-events: none; }
  .search .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: var(--surface-2); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .search-result { margin: 10px 0 0; font-size: 14px; color: var(--muted); min-height: 1.4em; }

  .jump { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; margin: 20px auto 0; max-width: 900px; }
  .jump-btn { font-size: 14px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
  .jump-btn:hover { color: var(--ink); background: rgba(59, 42, 26, .05); }

  .cat-list { display: grid; gap: 18px; margin-top: 30px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { .cat-list { grid-template-columns: 1fr; } }
  .cat-sec {
    position: relative; overflow: hidden; border-radius: 20px; padding: 22px 24px 18px; scroll-margin-top: 24px;
    background: rgba(255, 250, 241, .74); border: 1px solid rgba(59, 42, 26, .07);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 12px 32px rgba(90, 60, 25, .08);
    -webkit-backdrop-filter: blur(8px) saturate(140%); backdrop-filter: blur(8px) saturate(140%);
  }
  .cat-sec::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: linear-gradient(135deg, rgba(181, 119, 47, .06), transparent 40%); }
  .cat-title { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 14px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .cat-title::before, .cat-title::after {
    content: ""; flex: 0 1 72px; height: 2px;
    background-image: radial-gradient(circle, rgba(181, 119, 47, .5) 1px, transparent 1.2px); background-size: 6px 2px; background-repeat: repeat-x; background-position: center;
  }
  .cat-title .emo { font-size: 24px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; position: relative; }
  .chip {
    font-size: 16px; color: var(--ink); background: rgba(255, 255, 255, .9); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 15px; cursor: pointer; line-height: 1.3;
    transition: border-color .15s, box-shadow .2s, background .15s;
  }
  .chip .e { margin-right: 5px; }
  .chip:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(181, 119, 47, .12); }
  .chip.hit { border-color: var(--accent); background: #f6ead4; }
  .cat-sec.dim { display: none; }
  .chip.dim { display: none; }
  @keyframes flash { 0% { box-shadow: 0 0 0 2px rgba(181, 119, 47, .45); } 100% { box-shadow: 0 12px 32px rgba(90, 60, 25, .08); } }
  .cat-sec.flash { animation: flash 1.2s ease-out; }
  .empty-result { display: none; margin: 30px auto 0; color: var(--muted); }
  .empty-result.show { display: block; }

  /* 레이어 */
  dialog.layer {
    border: 0; padding: 0; color: var(--ink); text-align: left;
    width: min(760px, calc(100vw - 48px)); height: fit-content; max-height: calc(100dvh - 48px);
    max-width: none; margin: auto; inset: 0; border-radius: 20px; overflow: hidden;
    background: rgba(255, 250, 241, .95); border: 1px solid rgba(59, 42, 26, .08);
    box-shadow: 0 24px 60px rgba(90, 60, 25, .22);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  dialog.layer::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  @media (prefers-reduced-motion: no-preference) {
    dialog.layer[open], dialog.ad-gate[open] { animation: rise .2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
  .layer-inner { display: flex; flex-direction: column; max-height: calc(100dvh - 48px); }
  .layer-inner:focus { outline: none; }
  .layer-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .85); position: relative; }
  .layer-emo { font-size: 34px; line-height: 1; }
  .layer-titles { display: grid; gap: 2px; }
  .layer-sub { margin: 0; font-size: 13px; color: var(--muted); }
  .layer-title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .close { margin-left: auto; flex: none; width: 44px; height: 44px; margin-right: -8px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
  .close svg { width: 22px; height: 22px; }
  .close:hover { background: rgba(59, 42, 26, .06); }
  .layer-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .layer-body { padding: 18px 20px 14px; }

  .guide-sum { margin: 0 0 16px; font-size: 17px; line-height: 1.6; text-align: center; padding: 14px 16px; border-radius: 14px; background: #f6ead4; color: #4a2e12; }
  .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box { border-radius: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); }
  .box h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .box ul { margin: 0; padding-left: 1.15em; display: grid; gap: 6px; font-size: 15px; }
  .box.do h3 { color: var(--good); }
  .box.dont h3 { color: var(--bad); }
  .box.wear, .box.cash, .box.rule { grid-column: 1 / -1; }
  .box.steps { grid-column: 1 / -1; background: #f3f8f5; border-color: #d3e8dc; }
  .box.steps h3 { color: #1f6b48; }
  .box.steps ol { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 8px; }
  .box.steps li { counter-increment: st; position: relative; padding-left: 34px; font-size: 15px; line-height: 1.55; }
  .box.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #1f8a5a; color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .box p { margin: 0; font-size: 15px; }
  .box.wear { background: #f2f6ff; border-color: #d9e3fb; }
  .box.wear h3 { color: #2f4f9e; }
  .box.cash { background: #fff8ec; border-color: #f1dfbd; }
  .box.cash h3 { color: #9a6514; }
  .box.rule h3 { color: var(--muted); }
  .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .badge.avg { background: #9a6514; color: #fff; }
  .badge.range { background: #f1dfbd; color: #7a4f0e; }
  .box .src { margin-top: 8px; font-size: 12px; color: #8a6a3a; }
  .cash-sum { margin-bottom: 10px !important; }
  .rel { display: grid; gap: 6px; }
  .rel-row { background: rgba(255, 255, 255, .75); border: 1px solid #f1dfbd; border-radius: 10px; padding: 9px 12px; }
  .rel-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rel-who { font-size: 14px; color: #6b4a14; min-width: 7.5em; }
  .rel-amt { font-size: 16px; font-weight: 700; color: var(--ink); }
  .rel-tag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .rel-tag.avg { background: #9a6514; color: #fff; }
  .rel-tag.range { background: #f1dfbd; color: #7a4f0e; }
  .rel-note { margin: 4px 0 0 !important; font-size: 12.5px !important; color: #7a6342; }
  .guide-note { margin: 14px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 640px) {
    .guide-grid { grid-template-columns: 1fr; }
    dialog.layer { width: calc(100vw - 24px); max-height: calc(100dvh - 24px); border-radius: 18px; }
    .layer-inner { max-height: calc(100dvh - 24px); }
    .layer-body { padding: 14px 12px 12px; }
    .main { padding-top: 40px; }
    .cat-sec { padding: 18px 14px 14px; }
    .cat-title::before, .cat-title::after { flex-basis: 36px; }
    .chip { font-size: 15px; padding: 8px 13px; }
  }

  /* 툴팁 */
  .tip { position: fixed; z-index: 60; pointer-events: none; max-width: 280px; padding: 10px 12px; border-radius: 12px; text-align: left; font-size: 13px; line-height: 1.5;
    background: rgba(255, 255, 255, .97); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(90, 60, 25, .18); }
  .tip b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }

  /* 광고 */
  .ad-slot { position: relative; margin: 28px auto 0; max-width: 712px; padding: 28px 16px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .7); }
  .ad-page { max-width: none; padding-left: 12px; padding-right: 12px; }
  .ad-layer { margin: 0 20px 18px; max-width: none; }
  .ad-tag { position: absolute; top: 6px; left: 12px; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .ad-fit { width: 100%; height: calc(var(--ad-h, 140px) * var(--ad-scale, 1)); overflow: hidden; display: flex; justify-content: center; }
  .ad-frame { width: var(--ad-w, 680px); height: var(--ad-h, 140px); flex: none; transform: scale(var(--ad-scale, 1)); transform-origin: top center; border-radius: 8px; overflow: hidden; }
  .ad-frame iframe { display: block; max-width: none; }
  .ad-slot.ad-empty { display: none; }
  @media (max-width: 640px) { .ad-slot { padding: 26px 10px 10px; } .ad-layer { margin: 0 12px 12px; } }

  dialog.ad-gate { border: 0; padding: 0; background: transparent; overflow: visible; width: min(440px, calc(100vw - 24px)); height: fit-content; max-height: calc(100dvh - 24px); margin: auto; inset: 0; }
  dialog.ad-gate::backdrop { background: rgba(59, 42, 26, .45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .ad-gate-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 14px 10px; border-radius: 18px; background: rgba(255, 255, 255, .97); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(90, 60, 25, .3); }
  .ad-gate-inner:focus { outline: none; }
  .ad-gate-tag { margin: 0; align-self: flex-start; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .ad-gate-slot { margin: 0; padding: 0; width: 100%; max-width: 400px; border: 0; background: none; }
  .ad-gate-wait { margin: 2px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .ad-gate-bar { width: 100%; max-width: 400px; height: 3px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-bottom: 6px; }
  .ad-gate-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a4a1f, #c48a3e); border-radius: inherit; }
  .ad-gate-bar span.run { animation: gateFill 3s linear forwards; }
  @keyframes gateFill { from { width: 0; } to { width: 100%; } }

  .box.sec { margin-top: 12px; }
  .box.sec ul { font-size: 15px; }
  .box.sec p { font-size: 15px; }
  .fig { display: flex; justify-content: center; margin: 4px 0 6px; }
  .fig svg { width: min(260px, 70%); height: auto; }
  .fig .lbl { font: 700 13px Pretendard, sans-serif; fill: #8a4a1f; }
  .fig .lbl.sm { font-size: 11px; font-weight: 600; }
  .fig .head { fill: #fff6e6; stroke: #c9a878; stroke-width: 1.5; }
  .fig .head.hi { stroke: #a5521c; stroke-width: 3; }
  .fig .lo { fill: #fff6e6; stroke: #b49065; stroke-width: 1.5; }
  .fig .hi { fill: rgba(181, 119, 47, .35); stroke: #a5521c; stroke-width: 2.5; }
  .fig .guide { stroke: #b5772f; stroke-dasharray: 4 4; stroke-width: 1.2; }
  .box.tool { margin-top: 4px; background: #fff3df; border-color: #ecd2a6; }
  .box.tool h3 { color: #8a4a1f; }
  .saju-form { display: grid; gap: 8px; }
  .saju-form .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .saju-form .lab { min-width: 6em; font-size: 14px; color: var(--muted); }
  .saju-form input[type=date], .saju-form input[type=time] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .saju-form .opts { gap: 16px; font-size: 14px; color: var(--muted); }
  .go { font: inherit; font-weight: 700; color: #fffaf1; background: #8a4a1f; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; justify-self: start; }
  .go.ghost { background: transparent; color: #8a4a1f; border: 1px solid #c9a878; }
  .saju-out { margin-top: 12px; }
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pillar { display: grid; gap: 6px; text-align: center; }
  .pillar .pt { font-size: 12px; color: var(--muted); }
  .pc { border-radius: 12px; padding: 10px 4px; background: var(--surface); border: 2px solid var(--ec, #ddd); }
  .pc b { display: block; font-size: 30px; line-height: 1.1; color: var(--ec); font-family: "Noto Serif KR", "Batang", serif; }
  .pc span { font-size: 12px; color: var(--muted); }
  .pc.empty { color: var(--muted); font-size: 24px; border-style: dashed; border-color: var(--line); }
  .sub { margin: 14px 0 6px !important; font-size: 13px !important; color: var(--muted); }
  .ohaeng { display: grid; gap: 5px; }
  .oh { display: grid; grid-template-columns: 2em 1fr 3em; align-items: center; gap: 8px; font-size: 14px; }
  .ohb { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .ohb span { display: block; height: 100%; border-radius: 6px; }
  .ohn { text-align: right; color: var(--muted); }
  .saju-read { margin: 12px 0 0; padding-left: 1.15em; display: grid; gap: 6px; font-size: 15px; }
  .tool-note, .tool-help { margin: 10px 0 0 !important; font-size: 12.5px !important; color: var(--muted); }
  .tool-help { margin: 0 0 10px !important; }
  .tarot-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .tarot-out { margin-top: 14px; }
  .tarot-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tcard { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 14px 10px; border-radius: 14px;
    background: linear-gradient(160deg, #fffaf1, #f3e2c4); border: 2px solid #c9a878; box-shadow: 0 6px 18px rgba(90, 60, 25, .12); }
  @media (prefers-reduced-motion: no-preference) { .tcard { animation: flip .5s ease-out both; } @keyframes flip { from { opacity: 0; transform: rotateY(90deg); } to { opacity: 1; transform: none; } } }
  .tcard .tl { font-size: 12px; color: var(--muted); }
  .tcard .tn { font-size: 12px; color: #8a4a1f; letter-spacing: .1em; }
  .tcard .te { font-size: 40px; line-height: 1.2; }
  .tcard.rev .te { transform: rotate(180deg); }
  .tcard b { font-size: 17px; }
  .tcard .to { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #8a4a1f; color: #fff; }
  .tcard.rev .to { background: #f1dfbd; color: #7a4f0e; }
  .tcard p { margin: 4px 0 0; font-size: 14px; }
  @media (max-width: 640px) { .pc b { font-size: 24px; } }
  .saju-form select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .reading { margin-top: 16px; padding-top: 12px; border-top: 1px dashed #d9bf93; }
  .reading p { margin: 6px 0 0; font-size: 15px; }
  .reading ul { margin: 6px 0 0; padding-left: 1.15em; display: grid; gap: 6px; font-size: 15px; }
  .rh { margin: 12px 0 2px; font-size: 15px; color: #8a4a1f; display: flex; gap: 6px; align-items: center; }
  .reading .rh:first-child { margin-top: 0; }
  .ss-line { font-size: 12.5px !important; color: var(--muted); }
  .yr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .yr-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .yr-cell:first-child { grid-column: 1 / -1; background: #fbefd9; }
  .yr-cell b { font-size: 14px; color: #6b3a14; }
  .yr-cell p { margin: 4px 0 0 !important; font-size: 14.5px !important; }
  .months { display: grid; gap: 4px; margin-top: 8px; }
  .mrow { display: grid; grid-template-columns: 1.8em 3em 4.5em 1fr; gap: 6px; align-items: center; font-size: 14px; padding: 6px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .mrow.lv2 { background: #fdf3e0; }
  .mrow .mm { font-weight: 700; }
  .mrow .mg { color: var(--muted); font-size: 13px; }
  .chip.sm { font-size: 14px; padding: 6px 12px; }
  .chip[aria-pressed="true"] { background: #8a4a1f; color: #fffaf1; border-color: #8a4a1f; }
  .rel-sel { margin-bottom: 10px; gap: 6px; }
  .people { display: grid; gap: 8px; margin-bottom: 10px; }
  .person { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .person input[type=text] { width: 7em; }
  .person input { font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: #fffdf8; color: var(--ink); }
  .person .chk { font-size: 13px; color: var(--muted); }
  .person .rm { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px 8px; }
  .go:disabled { opacity: .45; cursor: default; }
  .gh-out { margin-top: 14px; display: grid; gap: 10px; }
  .gh-matrix { overflow-x: auto; }
  .gh-matrix table { border-collapse: collapse; font-size: 14px; margin: 0 auto; }
  .gh-matrix th, .gh-matrix td { padding: 7px 10px; border: 1px solid var(--line); text-align: center; white-space: nowrap; }
  .gh-matrix th { background: #f6ead4; }
  .gh-matrix td.top { background: #f3d9a8; font-weight: 700; } .gh-matrix td.good { background: #fbecd2; } .gh-matrix td.low { background: #f4e7e2; color: #8a3a2a; }
  .gh-sum { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 14.5px; }
  .gh-card { border-radius: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
  .gh-card.top { border-color: #d4a35a; background: #fdf3e0; }
  .gh-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gh-top b { font-size: 16px; }
  .gh-score { font-size: 22px; font-weight: 800; color: #8a4a1f; }

<div class="bg" aria-hidden="true"><canvas id="bgCanvas"></canvas></div>
<script>
// ═══ 배경: 점 격자 물결면 + 노드 연결선 + 계측 눈금 ═══════════════════
(function () {
  var cv = document.getElementById('bgCanvas');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, DPR = 1, small = false;
  var COLS, ROWS, grid = [], nodes = [], floaters = [], last = 0, raf = 0, t0 = performance.now();

  function setup() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    small = W < 700;
    COLS = small ? 84 : 150; ROWS = small ? 18 : 28;
    grid = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        grid.push({ u: c / (COLS - 1) * 2 - 1, v: r / (ROWS - 1) });   // u: 좌우 -1~1, v: 앞(0)~뒤(1)
      }
    }
    // 노드: 격자 위 임의의 점에 붙어 물결을 따라 움직임
    nodes = [];
    var n = small ? 8 : 14;
    for (var i = 0; i < n; i++) {
      var rr = 2 + Math.floor(Math.random() * (ROWS - 6));
      var cc = Math.floor(COLS * 0.08) + Math.floor(Math.random() * COLS * 0.84);
      nodes.push({ idx: rr * COLS + cc, phase: Math.random() * Math.PI * 2, label: Math.random() < 0.4, seed: Math.random() * 1000 });
    }
    // 위쪽 공간에 떠다니는 노드 (시스템 연결망)
    floaters = [];
    var m = small ? 0 : 16;   // 휴대폰에서는 제목을 가리지 않도록 생략
    for (var k = 0; k < m; k++) {
      var leftSide = k % 2 === 0;
      var lo = small ? 0.02 : (leftSide ? 0.02 : 0.78), hi = small ? 0.98 : (leftSide ? 0.22 : 0.98);
      floaters.push({ x: lo + Math.random() * (hi - lo), y: 0.06 + Math.random() * 0.36, minX: lo, maxX: hi, vx: (Math.random() - 0.5) * 0.006, vy: (Math.random() - 0.5) * 0.004,
        phase: Math.random() * Math.PI * 2, label: Math.random() < 0.3, seed: Math.random() * 1000 });
    }
  }

  // 여러 파동을 겹친 비선형 높이 함수
  function height(u, v, t) {
    var x = u * 3.2, z = v * 4.0;
    return 0.55 * Math.sin(x * 1.3 + t * 0.35 + z * 0.6)
         + 0.35 * Math.sin(z * 2.1 - t * 0.27 + Math.sin(x * 0.7 + t * 0.11) * 1.6)
         + 0.22 * Math.sin((x + z) * 2.7 + t * 0.52)
         + 0.12 * Math.sin(x * 5.3 - z * 3.1 - t * 0.8);
  }

  function project(u, v, y) {
    var depth = 1 + v * 4.2;                      // 1(앞) ~ 5.2(뒤)
    var horizon = H * 0.44;
    var sx = W / 2 + u * W * 1.15 / depth;
    var sy = horizon + (1 - y * 0.28) * H * 0.58 / depth;
    return { x: sx, y: sy, s: 1 / depth };
  }

  function drawTicks() {
    ctx.fillStyle = 'rgba(138,84,34,0.16)';
    var step = 24;
    for (var x = step; x < W; x += step) {
      var big = (x / step) % 8 === 0;
      ctx.fillRect(x, 14, big ? 2 : 1, big ? 2 : 1);
      ctx.fillRect(x, H - 16, big ? 2 : 1, big ? 2 : 1);
    }
    for (var y = step; y < H; y += step) {
      var big2 = (y / step) % 8 === 0;
      ctx.fillRect(14, y, big2 ? 2 : 1, big2 ? 2 : 1);
      ctx.fillRect(W - 16, y, big2 ? 2 : 1, big2 ? 2 : 1);
    }
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (document.hidden || document.body.classList.contains('layer-open')) return;
    var minGap = small ? 1000 / 24 : 1000 / 30;
    if (now - last < minGap) return;
    last = now;
    render((now - t0) / 1000);
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    drawTicks();

    // 점 격자 물결면 (뒤에서 앞으로)
    var pts = new Array(grid.length);
    for (var i = grid.length - 1; i >= 0; i--) {
      var g = grid[i];
      var y = height(g.u, g.v, t);
      var p = project(g.u, g.v, y);
      pts[i] = p;
      if (p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) continue;
      var crest = (y + 1.2) / 2.4;                // 0~1, 마루일수록 밝게
      var a = (0.16 + 0.62 * p.s) * (0.40 + 0.90 * crest);
      var r = 0.8 + 1.8 * p.s + crest * 0.6;
      ctx.fillStyle = 'rgba(138,84,34,' + Math.min(a * 0.62, 0.5).toFixed(3) + ')';
      ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
    }

    // 노드와 점선 연결
    var np = nodes.map(function (n) {
      var p = pts[n.idx];
      return { x: p.x, y: p.y - 26 * p.s - 6, s: p.s, n: n, anchored: true };
    });
    floaters.forEach(function (f) {
      f.x += f.vx / 30; f.y += f.vy / 30;
      if (f.x < f.minX || f.x > f.maxX) f.vx *= -1;
      if (f.y < 0.05 || f.y > 0.45) f.vy *= -1;
      np.push({ x: f.x * W + Math.sin(t * 0.3 + f.phase) * 12, y: f.y * H + Math.cos(t * 0.25 + f.phase) * 8, s: 0.45, n: f, anchored: false });
    });
    ctx.setLineDash([1, 5]);
    ctx.lineWidth = 1;
    var maxD = small ? 150 : 230;
    for (var a1 = 0; a1 < np.length; a1++) {
      for (var b1 = a1 + 1; b1 < np.length; b1++) {
        var dx = np[a1].x - np[b1].x, dy = np[a1].y - np[b1].y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > maxD) continue;
        var al = (1 - d / maxD) * 0.38;
        ctx.strokeStyle = 'rgba(138,84,34,' + al.toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(np[a1].x, np[a1].y); ctx.lineTo(np[b1].x, np[b1].y); ctx.stroke();
      }
    }
    // 노드에서 수면까지 내려오는 점선
    ctx.setLineDash([1, 3]);
    np.forEach(function (q) {
      if (!q.anchored) return;
      var base = pts[q.n.idx];
      ctx.strokeStyle = 'rgba(138,84,34,0.14)';
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(base.x, base.y); ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    np.forEach(function (q) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.4 + q.n.phase);
      var r = 1.6 + 2.2 * q.s;
      ctx.fillStyle = 'rgba(138,84,34,' + (0.30 + 0.30 * pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(138,84,34,' + (0.22 * (1 - pulse)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q.x, q.y, r + 4 + 8 * pulse, 0, Math.PI * 2); ctx.stroke();
    });
  }

  setup();
  window.addEventListener('resize', function () { setup(); if (reduce) render(8); });
  if (reduce) render(8);
  else raf = requestAnimationFrame(frame);
})();
</script>

    ['💕', '연애와 즐거움', '연애운과 창작 욕구가 올라가요. 취미를 즐겨 보세요.'],
    ['🩺', '일과 생활 관리', '일상 루틴과 건강 습관을 다지기 좋아요. 맡은 일이 많아져요.'],
    ['🤝', '관계와 파트너', '연인·동업자 등 1:1 관계가 중요해지는 달이에요.'],
    ['🔄', '깊은 변화', '공동 재정, 깊은 관계, 마음의 변화를 마주해요. 정리할 것을 정리해요.'],
    ['✈️', '여행과 확장', '먼 여행, 공부, 새로운 세계관에 끌려요. 시야를 넓혀요.'],
    ['🏆', '커리어와 명예', '일에서 성과와 인정을 받기 좋은 달이에요.'],
    ['🎉', '친구와 꿈', '모임과 네트워크가 활발해요. 장기적인 목표를 그려 봐요.'],
    ['🌙', '휴식과 정리', '한 해를 마무리하듯 쉬고 돌아보는 달이에요. 다음 출발을 준비해요.']
  ];
  function starMonthTool() {
    var box = el('section', 'box tool');
    var h = el('h3'); h.append(el('span', null, '🗓️'), document.createTextNode('월별 운세'));
    box.appendChild(h);
    var sIdx = null;
    box.appendChild(choiceQ('내 별자리', SIGNS.map(function (s) { return [s[1] + ' ' + s[0]]; }), function (i) { sIdx = i; paint(); }));
    var out = el('div', 'check-out');
    box.appendChild(out);
    function paint() {
      out.innerHTML = '';
      if (sIdx == null) return;
      var list = el('div', 'months');
      for (var m = 1; m <= 12; m++) {
        var sun = signOf(m, 15), house = (sun - sIdx + 12) % 12, hs = HOUSE[house];
        var row = el('div', 'mrow lv' + (house === 0 || house === 4 || house === 9 ? 2 : house === 7 || house === 11 ? 0 : 1));
        row.append(el('span', 'mi', hs[0]), el('span', 'mm', m + '월'), el('span', 'mg', SIGNS[sun][1] + ' ' + SIGNS[sun][0].replace('자리', '')), el('span', 'mt', (house + 1) + '하우스 · ' + hs[1] + ' — ' + hs[2]));
        list.appendChild(row);
      }
      out.appendChild(list);
      out.appendChild(el('p', 'tool-note', '태양이 지나는 별자리가 내 별자리로부터 몇 번째인지(솔라 하우스)로 달마다 주제를 정하는 방식이에요. 해마다 같은 흐름이 반복돼요.'));
    }
    return box;
  }
  function findItem(catId, name) { for (var k in ITEMS) { if (ITEMS[k].cat.id === catId && ITEMS[k].n === name) return ITEMS[k]; } return null; }

  // ── 주소(#항목) 변경: 막힌 환경에서는 건너뜀 ──
  var historyOk = true;
  function safeHistory(kind, state, hash) {
    if (!historyOk) return false;
    try { history[kind](state, '', hash); return true; } catch (e) { historyOk = false; return false; }
  }
  function openItem(id, push) {
    var it = ITEMS[id];
    if (!it) return;
    document.getElementById('layerEmo').textContent = it.e;
    document.getElementById('layerSub').textContent = it.cat.emoji + ' ' + it.cat.name;
    document.getElementById('layerTitle').textContent = it.n;
    render(it);
    if (!layer.open) { layer.showModal(); layer.querySelector('.layer-inner').focus(); }
    document.body.classList.add('layer-open');
    document.getElementById('layerScroll').scrollTop = 0;
    if (window.fitAds) window.fitAds();
    if (push) safeHistory('pushState', { item: id }, '#' + id);
  }
  function finishClose() {
    cleanupFns.forEach(function (f) { try { f(); } catch (e) {} }); cleanupFns = [];
    layerBody.innerHTML = '';
    if (layer.open) layer.close();
    document.body.classList.remove('layer-open');
  }
  function closeLayer() {
    if (historyOk && history.state && history.state.item && location.hash) { history.back(); return; }
    finishClose();
  }
  document.getElementById('closeBtn').addEventListener('click', closeLayer);
  layer.addEventListener('cancel', function (e) { e.preventDefault(); closeLayer(); });
  layer.addEventListener('click', function (e) { if (e.target === layer) closeLayer(); });
  window.addEventListener('popstate', function () {
    var id = location.hash.slice(1);
    if (ITEMS[id]) openItem(id, false); else finishClose();
  });
  var initial = location.hash.slice(1);
  if (ITEMS[initial]) { safeHistory('replaceState', { item: initial }, '#' + initial); openItem(initial, false); }

  // ── 광고 팝업: 무작위 간격(1~10)마다 세부 팝업 전에 3초 표시 ──
  var adGate = document.getElementById('adGate');
  var pendingId = null, gateTimer = 0, GATE_MS = 3000;
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function randGap() { return 1 + Math.floor(Math.random() * 10); }
  function isAdTurn() {
    var rec = null;
    try { rec = JSON.parse(localStorage.getItem('jeom-ad-gate') || 'null'); } catch (e) {}
    if (!rec || rec.date !== todayKey() || !rec.next) rec = { date: todayKey(), n: 0, next: randGap() };
    rec.n += 1;
    var due = rec.n >= rec.next;
    if (due) rec.next = rec.n + randGap();
    try { localStorage.setItem('jeom-ad-gate', JSON.stringify(rec)); } catch (e) {}
    return due;
  }
  function adReady() { var s = adGate.querySelector('.ad-gate-slot'); return !s.classList.contains('ad-empty') && !!s.querySelector('iframe'); }
  function requestOpen(id) {
    hideTip();
    if (isAdTurn() && adReady()) {
      pendingId = id;
      adGate.showModal();
      document.body.classList.add('layer-open');
      if (window.fitAds) window.fitAds();
      adGate.querySelector('.ad-gate-inner').focus();
      var bar = document.getElementById('adGateBar');
      bar.style.animationDuration = GATE_MS + 'ms';
      bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
      bar.onanimationend = function () { setTimeout(closeGate, 120); };
      clearTimeout(gateTimer);
      gateTimer = setTimeout(closeGate, GATE_MS + 400);
      return;
    }
    openItem(id, true);
  }
  function closeGate() {
    clearTimeout(gateTimer);
    if (!adGate.open) return;
    adGate.close();
    var id = pendingId; pendingId = null;
    if (id) openItem(id, true); else document.body.classList.remove('layer-open');
  }
  adGate.addEventListener('cancel', function (e) { e.preventDefault(); closeGate(); });

  // ── 툴팁: 마우스를 올리면 한 줄 요약 ──
  var canHover = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
  var tip = el('div', 'tip'); tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  var tipTimer = 0, tipFor = null;
  function hideTip() { clearTimeout(tipTimer); tipFor = null; tip.hidden = true; }
  function showTip(btn) {
    var it = ITEMS[btn.getAttribute('data-item')]; if (!it) return;
    tipFor = btn;
    tip.innerHTML = '';
    tip.append(el('b', null, it.e + ' ' + it.n), document.createTextNode(it.s));
    tip.hidden = false;
    var r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    var y = r.top - th - 10; if (y < 8) y = r.bottom + 10;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  if (canHover) {
    cats.addEventListener('mouseover', function (e) {
      var b = e.target.closest && e.target.closest('.chip[data-item]');
      if (!b || b === tipFor) return;
      clearTimeout(tipTimer); tipTimer = setTimeout(function () { showTip(b); }, 120);
    });
    cats.addEventListener('mouseout', function (e) {
      var b = e.target.closest && e.target.closest('.chip[data-item]');
      if (b && !b.contains(e.relatedTarget)) hideTip();
    });
    window.addEventListener('scroll', hideTip, { passive: true });
  }
})();
</script>
<script>
// ═══ 광고 배너: 화면 폭에 맞춰 비율 축소, 불러오지 못하면 접기 ═══
(function () {
  var slots = Array.prototype.slice.call(document.querySelectorAll('.ad-slot'));
  function fit() {
    slots.forEach(function (s) {
      var box = s.querySelector('.ad-fit');
      var w = box.clientWidth;
      if (!w) return;                         // 닫힌 팝업 안에서는 열릴 때 다시 계산
      var frame = s.querySelector('.ad-frame');
      var base = parseFloat(frame.getAttribute('data-w')) || 680;
      var k = Math.min(1, w / base);
      s.style.setProperty('--ad-scale', k.toFixed(4));
    });
  }
  window.fitAds = fit;
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(fit);
    slots.forEach(function (s) { ro.observe(s.querySelector('.ad-fit')); });
  }
  fit();
  // 스크립트가 막혔거나 광고 차단으로 배너가 없으면 칸을 접어요.
  setTimeout(function () {
    slots.forEach(function (s) {
      var f = s.querySelector('iframe');
      if (!f) s.classList.add('ad-empty');
    });
  }, 5000);
})();
</script>
</body>
