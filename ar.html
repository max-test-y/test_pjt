<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v8.4</title>
<meta name="theme-color" content="#0b0d10">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin="">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.22);
    filter: blur(4px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
  }
  #routeBottomSkirt {
    fill: url(#routeFill);
    pointer-events: none;
  }
  #routeRim {
    fill: none;
    stroke: rgba(220,242,255,.55);
    stroke-width: 2;
    stroke-linecap: round;
  }
  #routeEndBorder {
    fill: none;
    stroke: #4db5ff;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  #routeChevrons path {
    fill: none;
    stroke: url(#chevronStroke);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #routeEndPulse {
    fill: none;
    stroke: rgba(220,242,255,.6);
    stroke-width: 2;
    transform-box: fill-box;
    transform-origin: center;
    animation: endPulse 1.8s ease-out infinite;
  }
  #routeEndHalo {
    fill: rgba(47,141,255,.20);
    stroke: rgba(220,242,255,.7);
    stroke-width: 2;
  }
  #routeEndDot {
    fill: #eaf6ff;
    stroke: #4db5ff;
    stroke-width: 4;
  }
  @keyframes endPulse {
    0%   { transform: scale(0.8);  opacity: .65; }
    75%  { transform: scale(1.9);  opacity: 0; }
    100% { transform: scale(1.9);  opacity: 0; }
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  /* 하단 HUD: 거리 */
  #bottomHud {
    position:absolute;
    left:50%;
    bottom:calc(max(96px, calc(env(safe-area-inset-bottom) + 96px)) + min(20dvh, 220px));
    transform:translateX(-50%);
    width:min(94vw, 460px);
    min-height:78px;
    padding:9px 9px 9px 10px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.13);
    background:
      linear-gradient(180deg, rgba(18,22,29,.80), rgba(8,11,16,.72));
    box-shadow:
      0 10px 28px rgba(0,0,0,.24),
      inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(18px) saturate(1.12);
    -webkit-backdrop-filter:blur(18px) saturate(1.12);
    z-index:15;
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
  }

  #goalLabel {
    color:rgba(190,213,242,.78);
    font-size:11px;
    line-height:1;
    font-weight:760;
    letter-spacing:.01em;
    white-space:nowrap;
  }

  #distValue {
    color:rgba(255,255,255,.96);
    font-size:13px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #sensorToast {
    position:absolute;
    left:50%;
    bottom:auto;
    top:auto;
    z-index:20;
    max-width:min(88vw, 420px);
    padding:12px 16px;
    border-radius:14px;
    background:rgba(20,20,20,.88);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    font-size:13px;
    font-weight:700;
    line-height:1.45;
    text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.32);
    backdrop-filter:blur(10px);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%, 12px);
    transition:opacity .22s ease, transform .22s ease;
  }

  #sensorToast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 1 92px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }

  #mapTargetBtn {
    position: absolute;
    z-index: 12;
    top: max(58px, calc(env(safe-area-inset-top) + 58px));
    right: 14px;
    min-height: 0;
    width: auto;
    flex: none;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(20,20,20,.72);
    color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(10px);
    font-size: 12px;
    font-weight: 800;
  }

  #targetMapModal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: #111;
  }
  #targetMapModal.show { display: flex; }

  #targetMapHeader {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    background: rgba(18,18,18,.96);
    color: #fff;
  }
  #targetMapTitle {
    flex: 1;
    min-width: 0;
  }
  #targetMapTitle strong {
    display: block;
    font-size: 15px;
    margin-bottom: 3px;
  }
  #targetMapTitle span {
    display: block;
    font-size: 11px;
    opacity: .72;
  }
  #targetMapClose {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,.16);
    font-size: 13px;
  }

  #targetMap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background: #ddd;
  }

  #targetMapFooter {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom));
    background: rgba(18,18,18,.98);
    color: #fff;
  }
  #targetCoordText {
    min-width: 0;
    font-size: 12px;
    line-height: 1.45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #targetMapConfirm {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 10px 15px;
    border-radius: 13px;
    background: #fff;
    color: #111;
    font-size: 13px;
    font-weight: 800;
  }

  .leaflet-container {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }


  #miniMapShell {
    position:absolute; left:0; right:0; bottom:0;
    height:20dvh; min-height:145px; max-height:220px;
    z-index:6; overflow:hidden; pointer-events:auto;
    border-top:1px solid rgba(255,255,255,.34);
    box-shadow:0 -10px 28px rgba(0,0,0,.22); background:#dfe6ec;
  }
  #miniMapRotator {
    position:absolute; left:50%; top:50%; width:145%; height:210%;
    transform-origin:50% 50%; will-change:transform;
  }
  #miniMap { position:absolute; inset:0; width:100%; height:100%; background:#dfe6ec; pointer-events:auto; touch-action:none; }
  #miniMapShell { touch-action:none; }

  #miniMapDragLayer {
    position:absolute;
    inset:0;
    z-index:7;
    background:transparent;
    pointer-events:auto;
    touch-action:none;
    cursor:grab;
  }
  #miniMapDragLayer.dragging { cursor:grabbing; }
  .mini-map-user-marker {
    position:relative;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#1677ff;
    border:3px solid #fff;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    pointer-events:none;
    transform-origin:50% 50%;
    overflow:visible;
  }
  .mini-map-user-marker::before {
    content:"";
    position:absolute;
    inset:-7px;
    border:2px solid rgba(22,119,255,.58);
    border-radius:50%;
    animation:miniMapPulse 1.45s ease-out infinite;
  }

  @keyframes miniMapPulse {
    0%{transform:scale(.65);opacity:.88}
    72%{transform:scale(1.65);opacity:0}
    100%{transform:scale(1.65);opacity:0}
  }
.mini-route-number {
    width:22px;
    height:22px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#111827;
    color:#fff;
    border:2px solid #fff;
    box-shadow:0 2px 7px rgba(0,0,0,.32);
    font-size:12px;
    font-weight:900;
    line-height:1;
    transform-origin:50% 50%;
    will-change:transform;
  }

  .mini-route-number.active {
    background:#2f8dff;
    box-shadow:0 0 0 4px rgba(47,141,255,.22), 0 2px 8px rgba(0,0,0,.34);
  }

  #miniMapControls {
    position:absolute;
    right:10px;
    top:9px;
    z-index:12;
    display:flex;
    gap:6px;
    pointer-events:auto;
  }


  #app.map-hidden #miniMapShell {
    display:none;
  }


  #app.map-hidden #controls {
    bottom:max(18px, env(safe-area-inset-bottom));
  }

  #app.map-hidden #bottomHud {
    bottom:max(96px, calc(env(safe-area-inset-bottom) + 96px));
  }

  #app.map-hidden #sensorToast {
    bottom:max(150px, calc(env(safe-area-inset-bottom) + 150px));
  }

  #miniMapControls button {
    flex:none;
    width:36px;
    height:36px;
    min-height:36px;
    padding:0;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(18,18,18,.68);
    color:#fff;
    font-size:20px;
    font-weight:800;
    line-height:1;
    backdrop-filter:blur(8px);
  }

  #miniMapFullscreenBtn {
    font-size:17px !important;
  }

  #miniMapCloseBtn {
    display:none;
    width:auto !important;
    padding:0 12px !important;
    font-size:13px !important;
  }

  #miniMapShell.fullscreen {
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    min-height:0;
    max-height:none;
    z-index:200;
    border-top:0;
    box-shadow:none;
    pointer-events:auto;
  }

  #miniMapShell.fullscreen #miniMapCloseBtn {
    display:block;
  }

  #miniMapShell.fullscreen #miniMapFullscreenBtn {
    display:none;
  }

  #miniMapShell.fullscreen #miniMapRotator {
    width:100% !important;
    height:100% !important;
    min-width:0;
    min-height:0;
  }

  #miniMapShell.fullscreen #miniMap {
    width:100%;
    height:100%;
  }
  #controls { bottom:calc(max(18px, env(safe-area-inset-bottom)) + min(20dvh, 220px)); }
  #bottomHud { bottom:calc(max(96px, calc(env(safe-area-inset-bottom) + 96px)) + min(20dvh, 220px)); }
  #sensorToast { bottom:calc(max(150px, calc(env(safe-area-inset-bottom) + 150px)) + min(20dvh, 220px)); }



  /* ===== v7.4 Mobile Navigation UI Polish ===== */
  :root {
    --ui-bg: rgba(13,16,21,.78);
    --ui-bg-strong: rgba(10,12,16,.90);
    --ui-border: rgba(255,255,255,.13);
    --ui-border-strong: rgba(255,255,255,.22);
    --ui-text: #f7f9fc;
    --ui-muted: rgba(247,249,252,.68);
    --ui-accent: #4db5ff;
    --ui-accent-strong: #1677ff;
    --ui-radius: 18px;
    --ui-shadow: 0 10px 34px rgba(0,0,0,.30);
  }

  html, body, button {
    -webkit-tap-highlight-color: transparent;
  }

  button {
    font-family: inherit;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  button:focus-visible {
    outline: 2px solid rgba(132,190,255,.95);
    outline-offset: 2px;
  }

  button:active:not(:disabled) {
    transform: scale(.975);
  }

  button:disabled {
    opacity: .34;
    cursor: default;
  }

  #shade {
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.42) 0%,
        rgba(0,0,0,.12) 17%,
        rgba(0,0,0,0) 46%,
        rgba(0,0,0,.03) 63%,
        rgba(0,0,0,.40) 100%);
  }

  #topStatus {
    top: max(12px, calc(env(safe-area-inset-top) + 8px));
    left: 12px;
    right: 12px;
    gap: 6px;
  }

  .pill {
    min-height: 32px;
    display: flex;
    align-items: center;
    padding: 0 11px;
    border-radius: 12px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.16);
    backdrop-filter: blur(18px) saturate(1.15);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    color: var(--ui-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: -.1px;
  }

  #versionLabel {
    min-height: 26px;
    padding: 0 8px;
    border-radius: 9px;
    font-size: 10px;
    opacity: .76;
  }

  #mapTargetBtn,

  #mapTargetBtn {
    top: max(56px, calc(env(safe-area-inset-top) + 52px));
    right: 12px;
  }

  #bottomHud {
    width: min(calc(100vw - 24px), 440px);
    bottom: calc(max(82px, env(safe-area-inset-bottom) + 82px) + min(20dvh, 220px));
    text-shadow: none;
  }

  #distBlock {
    width: 100%;
    align-items: stretch;
    gap: 7px;
    padding: 13px 14px 14px;
    border: 1px solid var(--ui-border-strong);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(18,22,29,.88), rgba(10,13,18,.78));
    box-shadow: var(--ui-shadow);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
  }


  #goalLabel {
    max-width: 54%;
    padding: 0;
    border: 0;
    background: none;
    backdrop-filter: none;
    color: rgba(205,226,255,.92);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }



  #distValue {
    color: #fff;
    font-size: 20px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: -.5px;
    font-variant-numeric: tabular-nums;
  }

  #guideText {
    min-width:0;
    color:#fff;
    font-size:16px;
    line-height:1.25;
    font-weight:820;
    letter-spacing:-.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #controls {
    left: 12px;
    right: 12px;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + min(20dvh, 220px));
    gap: 7px;
    padding: 7px;
    border: 1px solid var(--ui-border);
    border-radius: 20px;
    background: rgba(10,12,16,.76);
    box-shadow: 0 10px 28px rgba(0,0,0,.30);
    backdrop-filter: blur(22px) saturate(1.18);
    -webkit-backdrop-filter: blur(22px) saturate(1.18);
  }

  #controls button {
    min-height: 48px;
    border-radius: 14px;
    padding: 0 11px;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: none;
    font-size: 13px;
    font-weight: 800;
    transition: transform .12s ease, opacity .12s ease, background .12s ease;
  }

  #controls button.secondary {
    flex: 0 1 76px;
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.90);
    border-color: rgba(255,255,255,.08);
  }

  #startBtn {
    flex: 1.45;
    background: #fff;
    color: #101318;
    border-color: rgba(255,255,255,.78) !important;
  }

  #debugBtn {
    flex: 0 1 64px !important;
  }

  #miniMapShell {
    border-top: 1px solid rgba(255,255,255,.55);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 34px rgba(0,0,0,.30);
    background: #e8edf2;
  }
#miniMapControls {
    top: 10px;
    right: 10px;
    gap: 5px;
    padding: 4px;
    border-radius: 14px;
    background: rgba(18,21,26,.74);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 5px 18px rgba(0,0,0,.20);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  #miniMapControls button {
    width: 40px;
    height: 40px;
    min-height: 40px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #fff;
    font-size: 19px;
    font-weight: 750;
  }

  #miniMapControls button:active:not(:disabled) {
    background: rgba(255,255,255,.11);
  }

  #miniMapCloseBtn {
    padding: 0 14px !important;
    background: rgba(255,255,255,.10) !important;
  }


  .mini-route-number {
    width: 30px;
    height: 30px;
    border: 2.5px solid #fff;
    background: #222833;
    box-shadow: 0 3px 10px rgba(0,0,0,.28);
    font-size: 12px;
    font-weight: 850;
  }

  .mini-route-number.active {
    background: var(--ui-accent-strong);
    box-shadow: 0 0 0 5px rgba(22,119,255,.18), 0 3px 10px rgba(0,0,0,.28);
  }

  .mini-map-user-marker {
    width: 20px;
    height: 20px;
    background: var(--ui-accent-strong);
    border: 3px solid #fff;
    box-shadow: 0 2px 9px rgba(0,0,0,.32), 0 0 0 1px rgba(0,76,190,.25);
  }

  #sensorToast {
    max-width: min(calc(100vw - 32px), 430px);
    bottom: calc(max(142px, env(safe-area-inset-bottom) + 142px) + min(20dvh, 220px));
    border-radius: 16px;
    background: rgba(14,17,22,.90);
    border: 1px solid var(--ui-border-strong);
    box-shadow: var(--ui-shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  #edgeHint {
    border-radius: 14px;
    background: rgba(13,16,21,.82);
    border-color: var(--ui-border);
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  #debug {
    left: 12px;
    right: 12px;
    bottom: calc(max(80px, env(safe-area-inset-bottom) + 80px) + min(20dvh, 220px));
    max-height: 42dvh;
    overflow: auto;
    padding: 12px 13px;
    border: 1px solid var(--ui-border);
    border-radius: 16px;
    background: rgba(8,10,13,.88);
    box-shadow: var(--ui-shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-size: 10px;
  }

  #targetMapModal {
    background: #0b0d10;
  }

  #targetMapHeader,
  #targetMapFooter {
    background: rgba(11,13,16,.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  #targetMapHeader {

  const COMPASS_TOAST_COOLDOWN_MS = 30000;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '-';
    if(m < 1000) return `${Math.round(m).toLocaleString()}m`;
    return `${(m/1000).toFixed(1)}km`;
  }

  function getGpsQuality(accuracy){
    if(!Number.isFinite(accuracy)) return {label:'수신 대기', level:'waiting'};
    if(accuracy <= 5)  return {label:'좋음', level:'good'};
    if(accuracy <= 12) return {label:'보통', level:'normal'};
    return {label:'불량', level:'poor'};
  }

  function latLonToLocalMeters(lat, lon, refLat, refLon){
    const R = 6371000;
    const x = toRad(lon - refLon) * R * Math.cos(toRad((lat + refLat) / 2));
    const y = toRad(lat - refLat) * R;
    return {x, y};
  }

  function localMetersToLatLon(x, y, refLat, refLon){
    const R = 6371000;
    const lat = refLat + toDeg(y / R);
    const lon = refLon + toDeg(x / (R * Math.cos(toRad((lat + refLat) / 2))));
    return {latitude: lat, longitude: lon};
  }

  function nearestPointOnSegmentMeters(pos, a, b){
    const refLat = pos.latitude;
    const refLon = pos.longitude;

    const p = {x:0, y:0};
    const aa = latLonToLocalMeters(a.lat, a.lon, refLat, refLon);
    const bb = latLonToLocalMeters(b.lat, b.lon, refLat, refLon);

    const vx = bb.x - aa.x;
    const vy = bb.y - aa.y;
    const len2 = vx*vx + vy*vy;

    if(len2 < 0.0001){
      return {
        latitude: a.lat,
        longitude: a.lon,
        distance: Math.hypot(aa.x, aa.y),
        t: 0
      };
    }

    let t = ((p.x-aa.x)*vx + (p.y-aa.y)*vy) / len2;
    t = clamp(t, 0, 1);

    const qx = aa.x + vx*t;
    const qy = aa.y + vy*t;

    const ll = localMetersToLatLon(qx, qy, refLat, refLon);

    return {
      latitude: ll.latitude,
      longitude: ll.longitude,
      distance: Math.hypot(qx, qy),
      t
    };
  }

  function applyRouteSnap(pos){
    // 목표1 이전에는 출발 경로가 없으므로 GPS를 그대로 사용한다.
    if(targetIndex <= 0){
      lastSnapDistance = null;
      lastSnapStrength = 0;
      return pos;
    }

    const prev = TARGETS[targetIndex - 1];
    const curr = TARGETS[targetIndex];
    const snap = nearestPointOnSegmentMeters(pos, prev, curr);

    lastSnapDistance = snap.distance;

    // 현재 위치가 경로에서 너무 멀면 다른 길일 가능성이 있으므로 스냅하지 않는다.
    if(snap.distance > ROUTE_SNAP_MAX_M){
      lastSnapStrength = 0;
      return pos;
    }

    // accuracy가 나쁠수록 경로선 신뢰도를 높인다.
    const accFactor = clamp((pos.accuracy - 3) / 10, 0, 1);

    // 경로선에 가까울수록 강하게 붙인다.
    const distanceFactor =
      snap.distance <= ROUTE_SNAP_FULL_M
        ? 1
        : clamp(
            1 - (snap.distance - ROUTE_SNAP_FULL_M) /
                (ROUTE_SNAP_MAX_M - ROUTE_SNAP_FULL_M),
            0,
            1
          );

    // 최소 35%, accuracy가 나쁠 때 최대 약 90%까지 스냅.
    const strength = distanceFactor * (0.35 + 0.55 * accFactor);
    lastSnapStrength = strength;

    return {
      latitude: pos.latitude + (snap.latitude - pos.latitude) * strength,
      longitude: pos.longitude + (snap.longitude - pos.longitude) * strength,
      accuracy: pos.accuracy
    };
  }

  function distanceBetweenPos(a, b){
    if(!a || !b) return Infinity;
    return haversine(a.latitude, a.longitude, b.latitude, b.longitude);
  }

  function addGpsSample(sample){
    const now = Date.now();

    // 너무 오래 전에 만들어진 위치는 사용하지 않는다.
    if(sample.timestamp && now - sample.timestamp > STALE_SAMPLE_MS){
      return false;
    }

    // 정확도가 너무 나쁜 샘플은 경로 계산에 사용하지 않는다.
    if(!Number.isFinite(sample.accuracy) || sample.accuracy > GPS_MAX_ACCURACY_M){
      return false;
    }

    lastRawAccuracy = sample.accuracy;

    if(lastAcceptedRawPos && lastAcceptedTimestamp){
      const dt = Math.max(0.2, (sample.timestamp - lastAcceptedTimestamp) / 1000);
      const jump = distanceBetweenPos(lastAcceptedRawPos, sample);
      const impliedSpeed = jump / dt;

      // 1) 큰 순간 점프
      if(jump > GPS_JUMP_LIMIT_M && sample.accuracy > 6){
        return false;
      }

      // 2) 보행 중이라고 보기 어려운 순간 속도
      // accuracy가 매우 좋은 샘플(<=4m)은 조금 관대하게 통과.
      if(impliedSpeed > MAX_WALK_SPEED_MPS && sample.accuracy > 4){
        return false;
      }
    }

    lastAcceptedRawPos = sample;
    lastAcceptedTimestamp = sample.timestamp;

    gpsHistory.push(sample);
    if(gpsHistory.length > GPS_HISTORY_SIZE){
      gpsHistory.shift();
    }

    // 최근 샘플들의 accuracy 가중 평균.
    // 최근 샘플에 약간 더 높은 시간 가중치도 부여한다.
    let sumW = 0;
    let lat = 0;
    let lon = 0;
    let acc = 0;

    for(let i=0;i<gpsHistory.length;i++){
      const p = gpsHistory[i];
      const ageWeight = 0.65 + 0.35 * ((i + 1) / gpsHistory.length);
      const accuracyWeight = 1 / Math.max(1, p.accuracy * p.accuracy);
      const w = accuracyWeight * ageWeight;

      sumW += w;
      lat += p.latitude * w;
      lon += p.longitude * w;
      acc += p.accuracy * w;
    }

    let weighted = {
      latitude: lat / sumW,
      longitude: lon / sumW,
      accuracy: acc / sumW
    };

    if(!filteredPos){
      filteredPos = weighted;
    }else{
      const move = distanceBetweenPos(filteredPos, weighted);

      // 정지 상태: GPS drift를 거의 고정.
      if(move <= GPS_STILL_RADIUS_M){
        const alpha = 0.08;
        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }else{
        // 실제 이동은 거리와 accuracy에 따라 적응적으로 추종.
        const accuracyFactor = clamp((12 - weighted.accuracy) / 9, 0, 1);

        let alpha =
          move > 8 ? 0.58 :
          move > 4 ? 0.42 :
                     0.28;

        alpha *= 0.75 + accuracyFactor * 0.25;

        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }
    }

    // 현재 활성 경로 구간에 대한 map-matching 보정.
    const snapped = applyRouteSnap(filteredPos);

    currentPos = {
      latitude: snapped.latitude,
      longitude: snapped.longitude,
      accuracy: filteredPos.accuracy
    };

    return true;
  }

  function getActiveTarget(){
    return TARGETS[targetIndex];
  }

  function updateTargetUi(){
    const currentStep = targetIndex + 1;

    goalLabel.textContent = `Step ${currentStep}/${TARGETS.length}`;
    guideText.textContent = getActiveTarget().guide || '다음 지점으로 이동하세요';

    nextTargetBtn.disabled = targetIndex >= TARGETS.length - 1;

  function setTargetIndex(nextIndex, reason='manual'){
    const clamped = clamp(nextIndex, 0, TARGETS.length - 1);
    if(clamped === targetIndex) return;

    targetIndex = clamped;
    cancelStepCountdown();
    nearbyConfirmCount = 0;
    advanceConfirmCount = 0;
    nearbyToastShown = false;
    lastSnapDistance = null;
    lastSnapStrength = 0;
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;

    updateMiniMapActiveMarker();
    updateTargetFromGps();

  function updateTargetFromGps(){
    if(!currentPos) return;

    const target = getActiveTarget();

    const nextTargetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    // GPS 위치가 몇 m만 흔들려도 목표 방위각이 계속 바뀔 수 있으므로
    // 목표 방위각 자체도 저역통과 필터로 부드럽게 만든다.
    if(targetBearing == null){
      targetBearing = nextTargetBearing;
    }else{
      const bearingDelta = norm180(nextTargetBearing - targetBearing);
      const absBearingDelta = Math.abs(bearingDelta);

      if(absBearingDelta >= 0.9){
        const bearingAlpha =
          absBearingDelta > 25 ? 0.32 :
          absBearingDelta > 12 ? 0.20 :
          absBearingDelta > 5  ? 0.11 :
                                 0.055;

        targetBearing = norm360(targetBearing + bearingDelta * bearingAlpha);
      }
    }

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    distValue.textContent = formatDistance(targetDistance);

    // 1단계: 10m 이내가 연속 3회 확인되면 현재 스텝 주변 도착 안내.
    // 같은 스텝에서는 한 번만 표시한다.
    if(targetDistance <= NEARBY_RADIUS_M){
      nearbyConfirmCount += 1;

      if(!nearbyToastShown &&
         nearbyConfirmCount >= PROXIMITY_CONFIRM_COUNT){
        nearbyToastShown = true;
        showNavigationToast(
          '이번 스텝의 목표위치 주변 입니다.',
          2200
        );
      }
    }else{
      nearbyConfirmCount = 0;
    }

    // 2단계: 8m 이내가 연속 3회 확인되면 3초 카운트다운 후 다음 스텝.
    // 카운트다운이 시작된 뒤에는 GPS 샘플이 계속 들어와도 중복 시작하지 않는다.
    if(targetDistance <= ADVANCE_RADIUS_M){
      advanceConfirmCount += 1;

      if(advanceConfirmCount >= PROXIMITY_CONFIRM_COUNT &&
         !stepCountdownActive){
        if(targetIndex < TARGETS.length - 1){
          startStepCountdown();
        }else if(!nearbyToastShown){
          nearbyToastShown = true;
          showNavigationToast(
            '최종 스텝의 목표 위치에 도착했습니다.',
            2400
          );
        }
      }
    }else if(!stepCountdownActive){
      advanceConfirmCount = 0;
    }
  }

  function positionSensorToast(){
    if(!sensorToast || !bottomHud) return;

    const hudRect = bottomHud.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();

    // bottomHud 상단에서 정확히 10px 위에 토스트의 하단이 오도록 배치.
    const toastBottomFromApp =
      Math.max(0, appRect.bottom - hudRect.top + 10);

    sensorToast.style.bottom = `${toastBottomFromApp}px`;
    sensorToast.style.top = 'auto';
  }

  function showNavigationToast(message, duration=2200){
    positionSensorToast();
    lastToastMessage = message;
    sensorToast.classList.remove('countdown');
    sensorToast.textContent = message;
    sensorToast.classList.add('show');

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{
      if(!stepCountdownActive){
        sensorToast.classList.remove('show');
      }
    }, duration);
  }

  function cancelStepCountdown(){
    if(stepCountdownTimer){
      clearInterval(stepCountdownTimer);
      stepCountdownTimer = null;
    }
    stepCountdownActive = false;
  }

  function startStepCountdown(){
    if(stepCountdownActive) return;
    if(targetIndex >= TARGETS.length - 1) return;

    stepCountdownActive = true;

    if(toastTimer){
      clearTimeout(toastTimer);
      toastTimer = null;
    }

    let remaining = STEP_COUNTDOWN_SECONDS;

    const renderCountdown = ()=>{
      positionSensorToast();
      sensorToast.classList.add('countdown');
      sensorToast.innerHTML =
        `<span class="countdown-number">${remaining}</span>` +
        `<span class="countdown-message">다음 스텝으로 이동합니다.</span>`;
      sensorToast.classList.add('show');
    };

    renderCountdown();

    stepCountdownTimer = setInterval(()=>{
      remaining -= 1;

      if(remaining > 0){
        renderCountdown();
        return;
      }

      clearInterval(stepCountdownTimer);
      stepCountdownTimer = null;

      sensorToast.classList.remove('countdown');
      sensorToast.textContent = '다음 스텝으로 이동합니다.';
      sensorToast.classList.add('show');

      const nextIndex = targetIndex + 1;
      stepCountdownActive = false;

      setTimeout(()=>{
        sensorToast.classList.remove('show');
        setTargetIndex(nextIndex, 'proximity-countdown');
      }, 350);
    }, 1000);
  }

  function showSensorToast(message, duration=4200){
    positionSensorToast();
    const now = Date.now();

    // 같은 토스트가 이미 화면에 떠 있으면 다시 시작하지 않는다.
    if(sensorToast.classList.contains('show') && lastToastMessage === message){
      return;
    }

    // 어떤 감지 로직에서 호출됐든 하나의 공통 쿨다운을 사용한다.
    if(now - lastCompassToastAt < COMPASS_TOAST_COOLDOWN_MS) return;

    lastCompassToastAt = now;
    lastToastMessage = message;
    sensorToast.classList.remove('countdown');
    sensorToast.textContent = message;
    sensorToast.classList.add('show');

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{
      sensorToast.classList.remove('show');
    }, duration);
  }

  function recordHeadingStability(heading){
    // webkitCompassAccuracy가 실제로 제공되는 기기에서는 직접 정확도만 사용한다.
    // 두 감지기가 동시에 토스트를 만들지 않게 하기 위한 분기다.
    if(directCompassAccuracyAvailable) return;

    const now = performance.now();
    headingJitterSamples.push({t:now, h:norm360(heading)});

    while(headingJitterSamples.length &&
          now - headingJitterSamples[0].t > 2500){
      headingJitterSamples.shift();
    }

    if(headingJitterSamples.length < 8) return;

    let totalMotion = 0;
    let signChanges = 0;
    let lastSign = 0;

    for(let i=1;i<headingJitterSamples.length;i++){
      const d = norm180(
        headingJitterSamples[i].h - headingJitterSamples[i-1].h
      );

      totalMotion += Math.abs(d);

      const sign = Math.abs(d) < 1.2 ? 0 : Math.sign(d);
      if(sign && lastSign && sign !== lastSign) signChanges++;
      if(sign) lastSign = sign;
    }

    const netMotion = Math.abs(norm180(
      headingJitterSamples[headingJitterSamples.length-1].h -
      headingJitterSamples[0].h
    ));

    // 짧은 시간에 좌우로 크게 출렁이지만 최종 방향 변화는 작은 경우를
    // 자력계가 불안정한 패턴으로 간주한다.
    if(totalMotion > 75 && netMotion < 18 && signChanges >= 3){
      showSensorToast(
        '방향이 불안정합니다. 휴대폰을 8자 모양으로 움직여 방향 센서를 보정해 주세요.'
      );
      headingJitterSamples.length = 0;
    }
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);
    recordHeadingStability(rawHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading-filteredHeading);

    // 작은 자력계 떨림은 유도선까지 전달하지 않는다.
    if(Math.abs(delta) < 1.2) return;

    // 실제 회전은 따라가되 기존보다 한 단계 더 완만하게 반영한다.
    const alpha =
      Math.abs(delta) > 40 ? 0.40 :
      Math.abs(delta) > 22 ? 0.30 :
      Math.abs(delta) > 10 ? 0.20 :
      Math.abs(delta) > 4  ? 0.12 :
                             0.06;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  // 기기를 앞/뒤로 기울인 정도(pitch)를 부드럽게 필터링한다.
  // ingestHeading과 같은 방식(변화가 클수록 빠르게 따라가고, 작은 떨림은
  // 무시)을 쓰되 각도 랩어라운드가 없으므로 단순 뺄셈으로 delta를 구한다.
  function ingestPitch(betaDeg){
    if(!Number.isFinite(betaDeg)) return;

    // beta=90 → 폰이 수직으로 서서 카메라가 지평선을 정면으로 볼 때.
    // 90보다 작아질수록(폰 위쪽이 앞으로/아래로 기울수록) 카메라가 더 아래를 본다.
    const rawPitch = clamp(90-betaDeg, PITCH_MIN_DEG, PITCH_MAX_DEG);

    if(filteredPitchDeg == null){
      filteredPitchDeg = rawPitch;
      return;
    }

    const delta = rawPitch-filteredPitchDeg;
    if(Math.abs(delta) < 0.6) return;

    const alpha =
      Math.abs(delta) > 22 ? 0.28 :
      Math.abs(delta) > 11 ? 0.18 :
      Math.abs(delta) > 5  ? 0.11 :
                             0.06;

    filteredPitchDeg += delta*alpha;
  }

  function handleOrientation(e){
    let h = null;

    const screenAngle =
      (screen.orientation && typeof screen.orientation.angle === 'number')
        ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;

      // iOS/Safari 계열에서 제공되는 경우 직접적인 나침반 정확도도 활용한다.
      if(Number.isFinite(e.webkitCompassAccuracy)){
        directCompassAccuracyAvailable = true;
        headingJitterSamples.length = 0;

        if(e.webkitCompassAccuracy > 25){
          compassPoorCount++;
          if(compassPoorCount >= 8){
            showSensorToast(
              '방향 정확도가 낮습니다. 휴대폰을 8자 모양으로 움직여 방향 센서를 보정해 주세요.'
            );
            compassPoorCount = 0;
          }
        }else{
          compassPoorCount = 0;
        }
      }
    }else if(typeof e.alpha === 'number'){
      h = norm360(360 - e.alpha + screenAngle);
    }

    if(h != null) ingestHeading(h);

    // 화면 회전 상태에 따라 beta/gamma 중 실제 "앞뒤 기울기"에 해당하는
    // 축을 고른다. 이 앱은 세로 모드 사용을 기준으로 설계됐다.
    if(typeof e.beta === 'number' && typeof e.gamma === 'number'){
      let tilt;
      if(screenAngle === 90){
        tilt = -e.gamma;
      }else if(screenAngle === -90 || screenAngle === 270){
        tilt = e.gamma;
      }else if(screenAngle === 180){
        tilt = -e.beta;
      }else{
        tilt = e.beta;
      }
      ingestPitch(tilt);
    }
  }

  function updateSmoothedRouteLength(ts){
    const now = Number.isFinite(ts) ? ts : performance.now();

    const desired =
      Number.isFinite(targetDistance)
        ? clamp(targetDistance, ROUTE_MIN_LEN_M, ROUTE_MAX_LEN_M)
        : ROUTE_MAX_LEN_M;

    if(lastRouteLengthTs == null){
      lastRouteLengthTs = now;
      smoothedRouteLengthM = desired;
      return smoothedRouteLengthM;
    }

    const dt = clamp((now - lastRouteLengthTs) / 1000, 0, 0.08);
    lastRouteLengthTs = now;

    if(dt <= 0) return smoothedRouteLengthM;

    const delta = desired - smoothedRouteLengthM;

    // 지수형 smoothing으로 목표값을 따라가되,
    // 한 프레임에서 변할 수 있는 길이를 초당 변화량으로 한 번 더 제한한다.
    const response = 1 - Math.exp(-ROUTE_LEN_RESPONSE * dt);
    let step = delta * response;

    const maxStep =
      (step < 0 ? ROUTE_SHRINK_MPS : ROUTE_GROW_MPS) * dt;

    step = clamp(step, -ROUTE_SHRINK_MPS * dt, ROUTE_GROW_MPS * dt);

    if(Math.abs(delta) < 0.03){
      smoothedRouteLengthM = desired;
    }else{
      smoothedRouteLengthM += step;
    }

    return clamp(
      smoothedRouteLengthM,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );
  }

  // 카메라(핀홀) 투영: 지면 위 좌표(x=좌우 m, z=전방 m)를 화면 픽셀로 변환.
  // 카메라 뒤쪽(camZ <= NEAR_CLIP)이면 null을 반환해 그리지 않는다.
  function project(x, z, W, H, f, pitchRad){
    const camY = z*Math.sin(pitchRad) - CAM_HEIGHT*Math.cos(pitchRad);
    const camZ = CAM_HEIGHT*Math.sin(pitchRad) + z*Math.cos(pitchRad);
    if(camZ <= NEAR_CLIP) return null;
    return {
      x: W/2 + f*(x/camZ),
      y: H/2 - f*(camY/camZ)
    };
  }

  // 목표 방향과 현재 진행 방향의 차이(diff, 도)를 이용해 지면 위의
  // 경로(세계 좌표)를 만들고, 그 경로를 카메라로 투영해 화면 리본을 그린다.
  // 각도 구간을 나눠 손으로 그리던 방식과 달리, 0~180° 어떤 값에서도
  // 하나의 연속된 곡선이라 경계에서 일그러지지 않는다. 곡선이 카메라
  // 뒤로 넘어가는 지점(급격한 U턴 등)은 자동으로 잘려서 표시된다.
  function buildRoute(diffDeg, routeLengthM){
    // 모바일 브라우저의 주소창/하단바 변화로 window.innerHeight와
    // 실제 SVG 표시 영역이 순간적으로 달라질 수 있으므로 SVG 실측 크기를 쓴다.
    const svgRect = routeSvg.getBoundingClientRect();
    const W = Math.max(1, svgRect.width);
    const H = Math.max(1, svgRect.height);
    const f = (W/2) / Math.tan(toRad(H_FOV/2));
    // 방향센서(beta)가 들어와 있으면 실시간 기울기를, 아니면 기본값을 쓴다.
    const pitchRad = toRad(filteredPitchDeg != null ? filteredPitchDeg : CAM_PITCH_DEG_DEFAULT);
    const pathLength = clamp(
      Number.isFinite(routeLengthM) ? routeLengthM : ROUTE_MAX_LEN_M,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );

    const diff = toRad(clamp(diffDeg, -180, 180));
    const absDeg = Math.min(180, Math.abs(diffDeg));

    // 회전이 클수록(급커브) 더 짧은 구간 안에서 방향을 트는 대신,
    // 지나치게 급하게 꺾이지 않도록 최소/최대 구간을 둔다.
    const turnLen = clamp(7 + absDeg*0.11, 7, 24);

    let x = 0, z = 0;
    const centerline = [{x, z, theta:0}];

    for(let i=1;i<=PATH_STEPS;i++){
      const s = i*(pathLength/PATH_STEPS);
      const t = clamp(s/turnLen, 0, 1);
      const ease = t*t*(3-2*t); // smoothstep: 방향 전환이 급격하지 않게
      const theta = diff*ease;
      const ds = pathLength/PATH_STEPS;

      x += Math.sin(theta)*ds;
      z += Math.cos(theta)*ds;

      centerline.push({x, z, theta});
    }

    const halfW = WORLD_WIDTH/2;
    const left = [], right = [], rim = [];

    for(let i=0;i<centerline.length;i++){
      const c = centerline[i];
      const nx = Math.cos(c.theta), nz = -Math.sin(c.theta); // 진행방향에 수직인 법선

      const lx = c.x + nx*halfW, lz = c.z + nz*halfW;
      const rx = c.x - nx*halfW, rz = c.z - nz*halfW;

      const lp = project(lx, lz, W, H, f, pitchRad);
      const rp = project(rx, rz, W, H, f, pitchRad);

      // 둘 중 하나라도 카메라 뒤로 넘어가면 그 지점부터는 경로를 끊는다.
      // 카메라 바로 앞(근접 클립 구간)은 아직 유효한 점이 하나도 없을 때만
      // 건너뛴다. 유효한 점들이 쌓인 이후에 클립되면(예: 급격한 U턴이
      // 카메라 뒤로 넘어갈 때) 그 지점에서 경로를 끊는다.
      if(!lp || !rp){
        if(left.length === 0) continue;
        break;
      }

      left.push(lp);
      right.push(rp);
      rim.push(lp);
    }

    if(left.length < 2){
      return { ribbonD:'', rimD:'', skirtD:'', centerline, end:null, W, H, f, pitchRad, pathLength };
    }

    // 화면 하단 시작점 고정:
    // 기울기나 투영 변화로 첫 유효 지점이 화면 위쪽에서 시작하더라도
    // 리본 시작부가 항상 화면 하단과 맞닿도록 하단 앵커를 추가한다.
    // 실제 첫 유효 단면을 기준으로 화면 아래쪽까지 충분히 연장한다.
    // 이 경로 자체와 별도로 routeBottomSkirt도 사용해 브라우저 UI 변화 시
    // 1프레임 정도의 좌표 불일치가 생겨도 하단에 카메라 영상이 비치지 않게 한다.
    const firstLeft = {...left[0]};
    const firstRight = {...right[0]};
    const bottomY = H + Math.max(360, H * 0.50);
    const bottomExpand = Math.max(W * 0.22, 120);

    const bottomLeftX = Math.min(firstLeft.x - bottomExpand, -W * 0.12);
    const bottomRightX = Math.max(firstRight.x + bottomExpand, W * 1.12);

    left.unshift({ x: bottomLeftX, y: bottomY });
    right.unshift({ x: bottomRightX, y: bottomY });
    rim.unshift({ x: bottomLeftX, y: bottomY });

    const skirtTopY = clamp(
      Math.max(firstLeft.y, firstRight.y) - 8,
      H - Math.max(170, H * 0.18),
      H
    );

    let ribbonD = `M ${left[0].x} ${left[0].y}`;
    for(let i=1;i<left.length;i++) ribbonD += ` L ${left[i].x} ${left[i].y}`;
    for(let i=right.length-1;i>=0;i--) ribbonD += ` L ${right[i].x} ${right[i].y}`;
    ribbonD += ' Z';

    let rimD = `M ${rim[0].x} ${rim[0].y}`;
    for(let i=1;i<rim.length;i++) rimD += ` L ${rim[i].x} ${rim[i].y}`;

    // 리본이 실제로 그려진 마지막 지점(=화면상 가장 먼 지점)을
    // 목적지 마커/펄스 위치로 사용한다.
    const li = left.length-1;
    const endLeft = { x:left[li].x, y:left[li].y };
    const endRight = { x:right[li].x, y:right[li].y };
    const end = {
      x: (endLeft.x+endRight.x)/2,
      y: (endLeft.y+endRight.y)/2
    };

    // 하단 전용 오버스캔 영역. 리본보다 뒤에서 같은 그라데이션으로 채운다.
    // 화면 아래쪽의 짧은 영역만 덮기 때문에 유도선 형태에는 영향을 주지 않는다.
    const skirtD =
      `M ${bottomLeftX} ${skirtTopY}` +
      ` L ${bottomRightX} ${skirtTopY}` +
      ` L ${bottomRightX} ${bottomY}` +
      ` L ${bottomLeftX} ${bottomY} Z`;

    return { ribbonD, rimD, skirtD, centerline, end, endLeft, endRight, W, H, f, pitchRad, pathLength };
  }

  function getStableTargetMarker(route, ts){
    if(
      !route ||
      targetBearing == null ||
      filteredHeading == null ||
      !Number.isFinite(targetDistance)
    ){
      return null;
    }

    // 실제 목표 방향과, 목표까지 남은 거리(최대 50m)를 직접 투영한다.
    // smoothedRouteLengthM을 사용해 GPS 거리값이 순간적으로 튀는 영향을 줄인다.
    const markerDistance = clamp(
      smoothedRouteLengthM,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );

    const markerDiff = toRad(
      clamp(norm180(targetBearing-filteredHeading), -180, 180)
    );

    const worldX = Math.sin(markerDiff)*markerDistance;
    const worldZ = Math.cos(markerDiff)*markerDistance;

    const projected = project(
      worldX, worldZ,
      route.W, route.H, route.f, route.pitchRad
    );

    if(!projected) return null;

    const targetMarkerOffsetY = clamp(route.H*0.065, 44, 72);
    const wantedX = projected.x;
    const wantedY = projected.y-targetMarkerOffsetY;
    const now = Number.isFinite(ts) ? ts : performance.now();

    if(markerScreenX == null || markerScreenY == null || markerLastTs == null){
      markerScreenX = wantedX;
      markerScreenY = wantedY;
      markerLastTs = now;
      return {x:markerScreenX, y:markerScreenY};
    }

    const dt = clamp((now-markerLastTs)/1000, 0, 0.08);
    markerLastTs = now;

    const dx = wantedX-markerScreenX;
    const dy = wantedY-markerScreenY;
    const movePx = Math.hypot(dx,dy);

    // 3px 이하는 센서/GPS 미세 흔들림으로 보고 고정한다.
    if(movePx <= 3){
      return {x:markerScreenX, y:markerScreenY};
    }

    // 큰 실제 회전은 빠르게, 작은 흔들림은 느리게 추종.
    const response =
      movePx > 120 ? 9.0 :
      movePx > 60  ? 6.0 :
      movePx > 24  ? 3.8 :
                     2.2;

    const alpha = 1-Math.exp(-response*dt);
    markerScreenX += dx*alpha;
    markerScreenY += dy*alpha;

    return {x:markerScreenX, y:markerScreenY};
  }

  // 지면 위 실제 미터 단위로 화살표를 배치하고 project()로 투영한다.
  // 리본과 동일한 카메라 모델을 쓰므로 원근감이 자연스럽게 일치한다.
  function updateChevrons(centerline, W, H, f, pitchRad, phaseM, spacingM, pathLength){
    const effectiveLength = clamp(pathLength || ROUTE_MAX_LEN_M, ROUTE_MIN_LEN_M, ROUTE_MAX_LEN_M);
    const ds = effectiveLength/PATH_STEPS;
    let d = ((phaseM % spacingM)+spacingM)%spacingM;
    let idx = 0;

    while(d < effectiveLength && idx < chevronPool.length){
      const fi = clamp(d/ds, 0, centerline.length-1);
      const i0 = Math.floor(fi);
      const i1 = Math.min(centerline.length-1, i0+1);
      const t = fi-i0;
      const c0 = centerline[i0], c1 = centerline[i1];

      const cx = lerp(c0.x,c1.x,t);
      const cz = lerp(c0.z,c1.z,t);
      const theta = lerp(c0.theta,c1.theta,t);

      const ux = Math.sin(theta), uz = Math.cos(theta);
      const nx = Math.cos(theta), nz = -Math.sin(theta);

      const backX = cx-ux*CHEVRON_LEN_M, backZ = cz-uz*CHEVRON_LEN_M;
      const leftX = backX+nx*CHEVRON_WIDTH_M, leftZ = backZ+nz*CHEVRON_WIDTH_M;
      const rightX = backX-nx*CHEVRON_WIDTH_M, rightZ = backZ-nz*CHEVRON_WIDTH_M;
      const tipX = cx+ux*CHEVRON_LEN_M*0.35, tipZ = cz+uz*CHEVRON_LEN_M*0.35;

      const pTip = project(tipX,tipZ,W,H,f,pitchRad);
      const pLeft = project(leftX,leftZ,W,H,f,pitchRad);
      const pRight = project(rightX,rightZ,W,H,f,pitchRad);

      if(pTip && pLeft && pRight){
        const distRatio = clamp(d/effectiveLength, 0, 1);
        let opacity = 0.88;
        if(distRatio < 0.04) opacity *= distRatio/0.04;
        if(distRatio > 0.82) opacity *= clamp((1-distRatio)/0.18, 0, 1);

        const size = Math.hypot(pTip.x-pLeft.x, pTip.y-pLeft.y);
        const strokeW = clamp(size*0.16, 1.4, 6);

        const el = chevronPool[idx++];
        el.setAttribute('d',
          `M ${pLeft.x.toFixed(1)} ${pLeft.y.toFixed(1)} L ${pTip.x.toFixed(1)} ${pTip.y.toFixed(1)} L ${pRight.x.toFixed(1)} ${pRight.y.toFixed(1)}`
        );
        el.setAttribute('stroke-width', strokeW.toFixed(1));
        el.setAttribute('opacity', opacity.toFixed(2));
      }

      d += spacingM;
    }

    for(;idx<chevronPool.length;idx++) chevronPool[idx].setAttribute('opacity','0');
  }

  function updateNavCompass(){
    if(!navCompass) return;

    if(targetBearing == null || filteredHeading == null){
      navCompass.style.transform='rotate(0deg)';
      navCompassAngle = 0;
      return;
    }

    const wanted = norm180(targetBearing-filteredHeading);
    const delta = norm180(wanted-navCompassAngle);
    const absDelta = Math.abs(delta);

    // 작은 센서 떨림은 무시하고, 실제 회전은 자연스럽게 따라간다.
    if(absDelta >= 0.8){
      const alpha =
        absDelta > 70 ? 0.28 :
        absDelta > 35 ? 0.20 :
        absDelta > 15 ? 0.14 :
        absDelta > 6  ? 0.09 :
                        0.055;

      navCompassAngle = norm180(navCompassAngle + delta*alpha);
    }

    navCompass.style.transform =
      `rotate(${navCompassAngle.toFixed(2)}deg)`;
  }

  function renderRoute(ts){
    if(targetBearing != null && rawHeading != null){
      const rawDiff = norm180(targetBearing-rawHeading);

      if(!alignedLock && Math.abs(rawDiff) <= 4){
        alignedLock = true;
      }else if(alignedLock && Math.abs(rawDiff) >= 7){
        alignedLock = false;
      }

      const crossedTarget =
        previousRawDiff != null &&
        Math.sign(previousRawDiff) !== Math.sign(rawDiff) &&
        Math.abs(rawDiff) < 12 &&
        Math.abs(previousRawDiff) < 12;

      previousRawDiff = rawDiff;

      if(alignedLock || crossedTarget){
        desiredDiff = 0;
        visualDiff *= 0.35;
      }else if(filteredHeading != null){
        desiredDiff = norm180(targetBearing-filteredHeading);
      }
    }

    const delta = norm180(desiredDiff-visualDiff);
    const absVisualDelta = Math.abs(delta);

    // 최종 화면 유도선에 별도의 dead-band를 둬 작은 좌우 출렁임을 억제한다.
    const visualAlpha =
      absVisualDelta > 75 ? 0.24 :
      absVisualDelta > 40 ? 0.17 :
      absVisualDelta > 18 ? 0.12 :
      absVisualDelta > 8  ? 0.075 :
                            0.045;

    if(absVisualDelta >= 1.25){
      visualDiff += delta*visualAlpha;
    }

    if(alignedLock && Math.abs(visualDiff) < 1.2){
      visualDiff = 0;
    }

    updateNavCompass();

    const routeLengthM = updateSmoothedRouteLength(ts);
    const route = buildRoute(visualDiff, routeLengthM);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeBottomSkirt.setAttribute('d',route.skirtD || '');
    routeRim.setAttribute('d',route.rimD);

    // 가까워질수록 유도선 끝의 종료선을 더 두껍고 진하게 표시.
    if(route.endLeft && route.endRight){
      routeEndBorder.setAttribute(
        'd',
        `M ${route.endLeft.x.toFixed(1)} ${route.endLeft.y.toFixed(1)} ` +
        `L ${route.endRight.x.toFixed(1)} ${route.endRight.y.toFixed(1)}`
      );

      const proximity = 1-clamp(
        (route.pathLength-ROUTE_MIN_LEN_M) /
        (ROUTE_MAX_LEN_M-ROUTE_MIN_LEN_M),
        0, 1
      );

      const borderWidth = 2.5 + proximity*7.5;
      const borderOpacity = 0.30 + proximity*0.70;

      routeEndBorder.setAttribute('stroke-width', borderWidth.toFixed(1));
      routeEndBorder.setAttribute('opacity', borderOpacity.toFixed(2));
      routeEndBorder.style.display = '';
    }else{
      routeEndBorder.style.display = 'none';
    }

    // 첨부파일과 동일한 지면 미터 기반 chevron 애니메이션
    if(lastTs == null) lastTs = ts || performance.now();
    const dt = clamp((ts||performance.now())-lastTs, 0, 48);
    lastTs = ts || performance.now();
    chevronPhase += dt*CHEVRON_SPEED_MPS/1000;

    if(route.centerline){
      updateChevrons(
        route.centerline,
        route.W,
        route.H,
        route.f,
        route.pitchRad,
        chevronPhase,
        CHEVRON_SPACING_M,
        route.pathLength
      );
    }

    // 첨부파일과 동일한 목표지점 pulse / halo / dot
    const stableMarker = getStableTargetMarker(route, ts);

    if(stableMarker){
      routeEndPulse.setAttribute('cx', stableMarker.x);
      routeEndPulse.setAttribute('cy', stableMarker.y);
      routeEndHalo.setAttribute('cx', stableMarker.x);
      routeEndHalo.setAttribute('cy', stableMarker.y);
      routeEndDot.setAttribute('cx', stableMarker.x);
      routeEndDot.setAttribute('cy', stableMarker.y);
      routeEndPulse.style.display = '';
      routeEndHalo.style.display = '';
      routeEndDot.style.display = '';
    }else{
      routeEndPulse.style.display = 'none';
      routeEndHalo.style.display = 'none';
      routeEndDot.style.display = 'none';
    }

    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      edgeHint.style.display = 'none';
    }else{
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
      updateMiniMap();
    }

    debug.textContent =
`목표: ${getActiveTarget().name} (${getActiveTarget().lat}, ${getActiveTarget().lon})
초기 단계 자동판정: ${initialStageResolved ? '완료' : '대기'}
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
위치 소스: ${manualUserPosition ? '사용자 임의 위치' : 'GPS'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
유도선 길이: ${smoothedRouteLengthM.toFixed(1)} m
GPS 상태: ${currentPos ? getGpsQuality(currentPos.accuracy).label : '수신 대기'}
GPS raw accuracy: ${lastRawAccuracy != null ? lastRawAccuracy.toFixed(1)+' m' : '-'}
GPS 보정 accuracy: ${currentPos ? currentPos.accuracy.toFixed(1)+' m' : '-'}
경로 이탈거리: ${lastSnapDistance != null ? lastSnapDistance.toFixed(1)+' m' : '-'}
경로 스냅강도: ${(lastSnapStrength*100).toFixed(0)}%
주변 확인(10m): ${nearbyConfirmCount}/${PROXIMITY_CONFIRM_COUNT}
전환 확인(8m): ${advanceConfirmCount}/${PROXIMITY_CONFIRM_COUNT}
전환 카운트다운: ${stepCountdownActive ? '진행 중' : '대기'}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
카메라 피치: ${filteredPitchDeg != null ? filteredPitchDeg.toFixed(1)+'° (센서)' : CAM_PITCH_DEG_DEFAULT+'° (기본값)'}
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      if(manualUserPosition){
        currentPos = {...manualUserPosition};
        gpsStatus.textContent = '사용자 위치 · 임의 설정';
        updateTargetFromGps();
        updateMiniMap();
        return;
      }

      const sample = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: pos.timestamp || Date.now()
      };

      const accepted = addGpsSample(sample);

      if(accepted){
        const snapText =
          lastSnapDistance == null
            ? ''
            : ` · 경로 ${lastSnapDistance.toFixed(1)}m`;

        const gpsQuality = getGpsQuality(currentPos.accuracy);
        gpsStatus.textContent =
          `GPS ${gpsQuality.label} · ±${Math.round(currentPos.accuracy)}m${snapText}`;

        if(!initialStageResolved){
          resolveInitialStageFromGps();
        }else{
          updateTargetFromGps();
        }

        updateMiniMap();
      }else{
        const gpsQuality = getGpsQuality(pos.coords.accuracy);
        gpsStatus.textContent =
          `GPS ${gpsQuality.label} · ±${Math.round(pos.coords.accuracy)}m · 대기`;
      }
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }


  function closestPointOnSegmentLocal(px,py,ax,ay,bx,by){
    const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,vv=vx*vx+vy*vy;
    const t=vv>0?clamp((wx*vx+wy*vy)/vv,0,1):0;
    const x=ax+vx*t,y=ay+vy*t;
    return {t,d:Math.hypot(px-x,py-y)};
  }

  function getClosestMiniMapSegment(lat,lon){
    let best=null;
    for(let i=0;i<MINI_MAP_ROUTE_POINTS.length-1;i++){
      const a=MINI_MAP_ROUTE_POINTS[i],b=MINI_MAP_ROUTE_POINTS[i+1];
      const aa=latLonToLocalMeters(a.lat,a.lng,lat,lon);
      const bb=latLonToLocalMeters(b.lat,b.lng,lat,lon);
      const cp=closestPointOnSegmentLocal(0,0,aa.x,aa.y,bb.x,bb.y);

      if(!best||cp.d<best.distance){
        best={
          index:i,
          distance:cp.d,
          t:cp.t,
          a,b,
          distanceToA:Math.hypot(aa.x,aa.y),
          distanceToB:Math.hypot(bb.x,bb.y)
        };
      }
    }
    return best;
  }

  function getMiniMapRouteSplit(lat,lon){
    const seg=getClosestMiniMapSegment(lat,lon);
    if(!seg) return null;

    const a=seg.a;
    const b=seg.b;
    const t=clamp(seg.t,0,1);

    // 현재 위치를 가장 가까운 경로 선분 위의 실제 진행점으로 투영.
    const progress={
      lat:a.lat+(b.lat-a.lat)*t,
      lng:a.lng+(b.lng-a.lng)*t
    };

    const traveled=[];
    for(let i=0;i<=seg.index;i++){
      const p=MINI_MAP_ROUTE_POINTS[i];
      traveled.push(new kakao.maps.LatLng(p.lat,p.lng));
    }
    traveled.push(new kakao.maps.LatLng(progress.lat,progress.lng));

    const remaining=[new kakao.maps.LatLng(progress.lat,progress.lng)];
    for(let i=seg.index+1;i<MINI_MAP_ROUTE_POINTS.length;i++){
      const p=MINI_MAP_ROUTE_POINTS[i];
      remaining.push(new kakao.maps.LatLng(p.lat,p.lng));
    }

    return {seg,progress,traveled,remaining};
  }

  function updateMiniMapRouteProgress(){
    if(!miniMapReady || !miniMap || !currentPos) return;
    if(
      !miniMapTraveledRoute ||
      !miniMapRemainingGlow ||
      !miniMapRemainingRoute ||
      !miniMapRemainingHighlight
    ) return;

    const split=getMiniMapRouteSplit(
      currentPos.latitude,
      currentPos.longitude
    );
    if(!split) return;

    // 이미 지나간 경로: 낮은 명도/투명도의 인디고-보라색.
    miniMapTraveledRoute.setPath(split.traveled);

    // 아직 가지 않은 경로: glow + 메인 + 중앙 하이라이트 3중 레이어.
    miniMapRemainingGlow.setPath(split.remaining);
    miniMapRemainingRoute.setPath(split.remaining);
    miniMapRemainingHighlight.setPath(split.remaining);
  }

  function detectInitialTargetIndex(lat,lon){
    const seg=getClosestMiniMapSegment(lat,lon);
    if(!seg) return 0;

    // 시작점/각 안내점 바로 근처에서는 그 안내점을 현재 목표로 본다.
    if(seg.distanceToA<=NEARBY_RADIUS_M) return seg.index;
    if(seg.distanceToB<=NEARBY_RADIUS_M) return seg.index+1;

    // 구간 초입 12%까지는 앞 번호를 유지하고,
    // 그 이후에는 진행 중인 구간의 다음 안내점을 목표로 삼는다.
    return seg.t<=0.12 ? seg.index : seg.index+1;
  }

  function resolveInitialStageFromGps(){
    if(initialStageResolved || !currentPos) return;

    const detected=clamp(
      detectInitialTargetIndex(currentPos.latitude,currentPos.longitude),
      0,
      TARGETS.length-1
    );

    initialStageResolved=true;

    if(detected!==targetIndex){
      setTargetIndex(detected,'initial-gps');
    }else{
      updateTargetUi();
      updateTargetFromGps();
    }
  }

  function updateMiniMapActiveMarker(){
    miniMapNumberMarkers.forEach((el,index)=>{
      el.classList.toggle('active',index===targetIndex);
    });
  }

  function getMiniMapVisualScale(){
    return miniMapShell.classList.contains('fullscreen')
      ? MINI_MAP_FULLSCREEN_SCALE
      : 1;
  }

  function rotateScreenDeltaToMapLocal(dx,dy){
    // 화면에서 보이는 드래그 벡터를 지도 로컬 좌표계로 역회전한다.
    // 전체화면에서는 지도 레이어가 scale 되어 있으므로 픽셀 이동량도 역보정.
    const scale = getMiniMapVisualScale();
    const sx = dx/scale;
    const sy = dy/scale;
    const rad = -miniMapHeadingDeg*Math.PI/180;
    const cos = Math.cos(rad);
    const sin = Math.sin(rad);

    return {
      x: sx*cos - sy*sin,
      y: sx*sin + sy*cos
    };
  }

  function beginMiniMapDrag(e){
    if(!miniMapReady || !miniMap) return;
    if(e.button != null && e.button !== 0) return;

    miniMapDragActive = true;
    miniMapDragPointerId = e.pointerId;
    miniMapDragLastX = e.clientX;
    miniMapDragLastY = e.clientY;

    miniMapUserInteracting = true;
    miniMapFollowResumeAt = Infinity;
    miniMapDragLayer.classList.add('dragging');

    if(miniMapDragLayer.setPointerCapture && e.pointerId != null){
      try{ miniMapDragLayer.setPointerCapture(e.pointerId); }catch(_){}
    }

    e.preventDefault();
  }

  function moveMiniMapDrag(e){
    if(!miniMapDragActive) return;
    if(miniMapDragPointerId != null && e.pointerId !== miniMapDragPointerId) return;
    if(!miniMapReady || !miniMap) return;

    const dx = e.clientX-miniMapDragLastX;
    const dy = e.clientY-miniMapDragLastY;

    miniMapDragLastX = e.clientX;
    miniMapDragLastY = e.clientY;

    if(Math.abs(dx)<0.2 && Math.abs(dy)<0.2) return;

    const local = rotateScreenDeltaToMapLocal(dx,dy);

    // panBy는 애니메이션 이동이라 연속 pointermove에서 이동량이 누락될 수 있다.
    // 현재 지도 투영좌표에서 "화면 픽셀만큼 이동한 새 중심 좌표"를 직접 계산해
    // setCenter()로 즉시 반영한다.
    const projection = miniMap.getProjection();
    const center = miniMap.getCenter();
    const centerPoint = projection.containerPointFromCoords(center);

    const nextCenter = projection.coordsFromContainerPoint(
      new kakao.maps.Point(
        centerPoint.x - local.x,
        centerPoint.y - local.y
      )
    );

    miniMap.setCenter(nextCenter);

    // 현재 위치 마커는 실제 GPS 좌표의 CustomOverlay라
    // 지도 중심이 이동하면 그 좌표에 맞춰 함께 화면상 위치가 변한다.
    updateMiniMapUserOverlay();

    e.preventDefault();
  }

  function endMiniMapDrag(e){
    if(!miniMapDragActive) return;
    if(
      miniMapDragPointerId != null &&
      e.pointerId != null &&
      e.pointerId !== miniMapDragPointerId
    ) return;

    miniMapDragActive = false;
    miniMapDragPointerId = null;
    miniMapUserInteracting = false;
    miniMapFollowResumeAt = Date.now()+MINI_MAP_FOLLOW_RESUME_MS;
    miniMapDragLayer.classList.remove('dragging');

    if(miniMapDragLayer.releasePointerCapture && e.pointerId != null){
      try{ miniMapDragLayer.releasePointerCapture(e.pointerId); }catch(_){}
    }

    e.preventDefault();
  }

  function installMiniMapScreenDrag(){
    miniMapDragLayer.addEventListener('pointerdown',beginMiniMapDrag,{passive:false});
    miniMapDragLayer.addEventListener('pointermove',moveMiniMapDrag,{passive:false});
    miniMapDragLayer.addEventListener('pointerup',endMiniMapDrag,{passive:false});
    miniMapDragLayer.addEventListener('pointercancel',endMiniMapDrag,{passive:false});
  }

  function ensureMiniMapUserOverlay(){
    if(!miniMapReady || !miniMap || miniMapUserOverlay) return;

    miniMapUserMarkerEl=document.createElement('div');
    miniMapUserMarkerEl.className='mini-map-user-marker';

    const initial=currentPos
      ? new kakao.maps.LatLng(currentPos.latitude,currentPos.longitude)
      : new kakao.maps.LatLng(MINI_MAP_ROUTE_POINTS[0].lat,MINI_MAP_ROUTE_POINTS[0].lng);

    miniMapUserOverlay=new kakao.maps.CustomOverlay({
      map:miniMap,
      position:initial,
      content:miniMapUserMarkerEl,
      xAnchor:.5,
      yAnchor:.5,
      zIndex:9
    });
  }

  function updateMiniMapUserOverlay(){
    if(!miniMapReady || !miniMap || !currentPos) return;
    ensureMiniMapUserOverlay();
    if(!miniMapUserOverlay) return;

    miniMapUserOverlay.setPosition(
      new kakao.maps.LatLng(currentPos.latitude,currentPos.longitude)
    );
  }

  function initMiniMap(){
    if(miniMapReady || !(window.kakao&&kakao.maps)) return;
    const start=currentPos
      ? new kakao.maps.LatLng(currentPos.latitude,currentPos.longitude)
      : new kakao.maps.LatLng(MINI_MAP_ROUTE_POINTS[0].lat,MINI_MAP_ROUTE_POINTS[0].lng);

    miniMap=new kakao.maps.Map(document.getElementById('miniMap'),{center:start,level:3});
    // CSS로 지도 전체를 heading에 맞춰 회전시키기 때문에
    // 카카오 기본 drag를 쓰면 입력 방향까지 지도 좌표계에 종속된다.
    // 기본 drag는 끄고 아래의 화면좌표 기반 custom drag를 사용한다.
    miniMap.setDraggable(false);
    miniMap.setZoomable(true);

    kakao.maps.event.addListener(miniMap,'zoom_changed',()=>{
      miniMapFollowResumeAt = Date.now() + MINI_MAP_FOLLOW_RESUME_MS;
    });

    const fullRoutePath=
      MINI_MAP_ROUTE_POINTS.map(
        p=>new kakao.maps.LatLng(p.lat,p.lng)
      );

    // 지나온 경로: 첨부 이미지처럼 어둡고 낮은 존재감의 인디고/보라.
    miniMapTraveledRoute=new kakao.maps.Polyline({
      map:miniMap,
      path:fullRoutePath,
      strokeWeight:7,
      strokeColor:'#13A8FF',
      strokeOpacity:.72,
      strokeStyle:'shortdash',
      zIndex:1
    });

    // 남은 경로 바깥 glow.
    miniMapRemainingGlow=new kakao.maps.Polyline({
      map:miniMap,
      path:fullRoutePath,
      strokeWeight:15,
      strokeColor:'#13A8FF',
      strokeOpacity:.14,
      strokeStyle:'solid',
      zIndex:2
    });

    // 남은 경로 메인 라인.
    miniMapRemainingRoute=new kakao.maps.Polyline({
      map:miniMap,
      path:fullRoutePath,
      strokeWeight:8,
      strokeColor:'#1AAAFE',
      strokeOpacity:.96,
      strokeStyle:'solid',
      zIndex:3
    });

    // 중심부 밝은 하이라이트.
    miniMapRemainingHighlight=new kakao.maps.Polyline({
      map:miniMap,
      path:fullRoutePath,
      strokeWeight:3,
      strokeColor:'#7DD8FF',
      strokeOpacity:.58,
      strokeStyle:'solid',
      zIndex:4
    });

    MINI_MAP_ROUTE_POINTS.forEach((p,index)=>{
      const marker=document.createElement('div');
      marker.className='mini-route-number';
      marker.textContent=String(p.seq);

      new kakao.maps.CustomOverlay({
        map:miniMap,
        position:new kakao.maps.LatLng(p.lat,p.lng),
        content:marker,
        xAnchor:.5,
        yAnchor:.5,
        zIndex:6
      });

      miniMapNumberMarkers.push(marker);
    });

    updateMiniMapActiveMarker();
    miniMapReady=true;
    ensureMiniMapUserOverlay();
    updateMiniMapRouteProgress();
    updateMiniMapTransform();

    requestAnimationFrame(()=>kakao.maps.event.trigger(miniMap,'resize'));
  }

  function setControlsVisible(visible){
    controlsVisible = !!visible;
    app.classList.toggle('controls-hidden', !controlsVisible);

    miniMapVisible = !!visible;
    app.classList.toggle('map-hidden', !miniMapVisible);

  function recenterMiniMap(force=false){
    if(!miniMapReady || !miniMap || !currentPos) return;

    if(!force){
      if(miniMapUserInteracting) return;
      if(Date.now() < miniMapFollowResumeAt) return;
    }

    miniMap.setCenter(
      new kakao.maps.LatLng(currentPos.latitude, currentPos.longitude)
    );
  }

  function sizeMiniMapForCurrentMode(){
    const fullscreen = miniMapShell.classList.contains('fullscreen');

    if(fullscreen){
      const vv = window.visualViewport;
      const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
      const top = Math.round(vv ? vv.offsetTop : 0);
      const left = Math.round(vv ? vv.offsetLeft : 0);

      miniMapShell.style.left = `${left}px`;
      miniMapShell.style.top = `${top}px`;
      miniMapShell.style.right = 'auto';
      miniMapShell.style.bottom = 'auto';
      miniMapShell.style.width = `${w}px`;
      miniMapShell.style.height = `${h}px`;

      // 실제 Kakao map 컨테이너는 viewport와 같은 크기를 유지한다.
      // 회전시 모서리 빈 공간은 transform scale로만 보충한다.
      miniMapRotator.style.width = '100%';
      miniMapRotator.style.height = '100%';
    }else{
      miniMapShell.style.left = '';
      miniMapShell.style.top = '';
      miniMapShell.style.right = '';
      miniMapShell.style.bottom = '';
      miniMapShell.style.width = '';
      miniMapShell.style.height = '';
      miniMapRotator.style.width = '';
      miniMapRotator.style.height = '';
    }
  }

  function refreshMiniMapLayout(){
    sizeMiniMapForCurrentMode();
    if(!miniMapReady || !miniMap) return;

    const center = miniMap.getCenter();

    const refresh = ()=>{
      sizeMiniMapForCurrentMode();

      // Kakao 공식 API: 지도 컨테이너 크기 변경 후 반드시 relayout().
      miniMap.relayout();

      if(center) miniMap.setCenter(center);
      updateMiniMapUserOverlay();
      updateMiniMapRouteProgress();
      updateMiniMapTransform();
    };

    requestAnimationFrame(()=>{
      refresh();
      setTimeout(refresh,60);
      setTimeout(refresh,180);
      setTimeout(refresh,360);
    });
  }

  function setMiniMapFullscreen(enabled){
    miniMapShell.classList.toggle('fullscreen', enabled);
    document.body.style.overflow = enabled ? 'hidden' : '';
    sizeMiniMapForCurrentMode();
    updateMiniMapTransform();

    requestAnimationFrame(()=>{
      refreshMiniMapLayout();
    });
  }

  function ensureMiniMap(){
    if(miniMapReady) return;
    if(window.kakao&&kakao.maps&&kakao.maps.load) kakao.maps.load(initMiniMap);
  }

  function updateMiniMapTransform(){
    const scale = getMiniMapVisualScale();

    miniMapRotator.style.transform =
      `translate(-50%, -50%) rotate(${miniMapHeadingDeg.toFixed(2)}deg) scale(${scale})`;

    // 숫자 마커와 현재 위치 마커는 화면상 크기가 커지지 않도록 역회전/역스케일.
    const inverseScale = 1/scale;

    miniMapNumberMarkers.forEach(el=>{
      el.style.transform =
        `rotate(${-miniMapHeadingDeg.toFixed(2)}deg) scale(${inverseScale})`;
    });

    if(miniMapUserMarkerEl){
      const counter = -miniMapHeadingDeg.toFixed(2);
      miniMapUserMarkerEl.style.transform =
        `rotate(${counter}deg) scale(${inverseScale})`;
    }
  }

  function updateMiniMap(){
    if(!miniMapVisible) return;
    if(!currentPos) return;
    ensureMiniMap();
    if(!miniMapReady||!miniMap) return;

    const lat=currentPos.latitude,lon=currentPos.longitude;
    const here=new kakao.maps.LatLng(lat,lon);

    // 실제 GPS 좌표에 붙는 지도 오버레이.
    updateMiniMapUserOverlay();

    // 현재 위치의 경로 진행점을 기준으로 지나온/남은 경로를 즉시 재분할.
    updateMiniMapRouteProgress();

    if(!miniMapUserInteracting && Date.now() >= miniMapFollowResumeAt){
      miniMap.setCenter(here);
    }

    const seg=getClosestMiniMapSegment(lat,lon);
    if(seg){

      if(seg.index!==miniMapLastSegment){
        miniMapLastSegment=seg.index;
        miniMap.relayout();

        if(!miniMapUserInteracting && Date.now() >= miniMapFollowResumeAt){
          miniMap.setCenter(here);
        }
      }
    }

    if(filteredHeading!=null){
      const wanted=-filteredHeading;
      const delta=norm180(wanted-miniMapHeadingDeg);
      if(Math.abs(delta)>=.8) miniMapHeadingDeg+=delta*.14;
      updateMiniMapTransform();
    }

    updateMiniMapActiveMarker();
  }

  function setPendingTarget(lat, lon, moveMap=false){
    pendingTargetLatLng = {lat, lon};
    targetCoordText.textContent =
      `${lat.toFixed(7)}, ${lon.toFixed(7)}`;

    if(targetMap){
      if(targetMapMarker){
        targetMapMarker.setLatLng([lat, lon]);
      }else{
        targetMapMarker = L.marker([lat, lon]).addTo(targetMap);
      }

      if(moveMap){
        targetMap.panTo([lat, lon]);
      }
    }
  }

  function ensureTargetMap(center){
    if(typeof L === 'undefined'){
      targetCoordText.textContent =
        '지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
      return false;
    }

    if(!targetMap){
      targetMap = L.map('targetMap', {
        zoomControl: true,
        attributionControl: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(targetMap);

      targetMap.on('click', e=>{
        setPendingTarget(e.latlng.lat, e.latlng.lng);
      });
    }

    targetMap.setView(center, 18);
    return true;
  }

  function openTargetMap(){
    const fallbackTarget = getActiveTarget();
    const center = currentPos
      ? [currentPos.latitude, currentPos.longitude]
      : [fallbackTarget.lat, fallbackTarget.lon];

    targetMapModal.classList.add('show');
    targetMapModal.setAttribute('aria-hidden', 'false');

    requestAnimationFrame(()=>{
      if(!ensureTargetMap(center)) return;

      targetMap.invalidateSize(true);

      // 열 때마다 현재 사용자 위치를 선택 상태로 표시한다.
      setPendingTarget(center[0], center[1], false);
    });
  }

  function closeTargetMap(){
    targetMapModal.classList.remove('show');
    targetMapModal.setAttribute('aria-hidden', 'true');
  }

  function applyPendingUserPosition(){
    if(!pendingTargetLatLng) return;

    manualUserPosition = {
      latitude: pendingTargetLatLng.lat,
      longitude: pendingTargetLatLng.lon,
      accuracy: 1
    };

    currentPos = {...manualUserPosition};

    // 임의 위치를 기준으로 현재 단계도 다시 판정한다.
    const detected = clamp(
      detectInitialTargetIndex(currentPos.latitude, currentPos.longitude),
      0,
      TARGETS.length - 1
    );

    initialStageResolved = true;

    cancelStepCountdown();
    nearbyConfirmCount = 0;
    advanceConfirmCount = 0;
    nearbyToastShown = false;
    lastSnapDistance = null;
    lastSnapStrength = 0;
    targetBearing = null;
    targetDistance = null;
    navCompassAngle = 0;
    if(navCompass) navCompass.style.transform='rotate(0deg)';
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;
    visualDiff = 0;
    lastRouteLengthTs = null;
    markerScreenX = null;
    markerScreenY = null;
    markerLastTs = null;

    if(detected !== targetIndex){
      setTargetIndex(detected, 'manual-user-position');
    }else{
      updateTargetUi();
      updateTargetFromGps();
    }

    updateMiniMapUserOverlay();
    if(miniMapReady && miniMap){
      miniMap.setCenter(
        new kakao.maps.LatLng(currentPos.latitude, currentPos.longitude)
      );
    }
    updateMiniMap();

    closeTargetMap();

    showNavigationToast(
      '사용자 위치를 선택한 지점으로 변경했습니다.',
      2400
    );
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  prevTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex - 1, 'manual');
  });

  nextTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex + 1, 'manual');
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  miniMapToggleBtn.addEventListener('click',()=>{
    setMiniMapVisible(!miniMapVisible);
  });

  controlsToggleBtn.addEventListener('click',()=>{
    setControlsVisible(!controlsVisible);
  });

  miniMapZoomInBtn.addEventListener('click',()=>{
    if(!miniMapReady || !miniMap) return;
    miniMapFollowResumeAt = Date.now() + MINI_MAP_FOLLOW_RESUME_MS;
    const nextLevel = Math.max(1, miniMap.getLevel()-1);
    miniMap.setLevel(nextLevel);
  });

  miniMapZoomOutBtn.addEventListener('click',()=>{
    if(!miniMapReady || !miniMap) return;
    miniMapFollowResumeAt = Date.now() + MINI_MAP_FOLLOW_RESUME_MS;
    const nextLevel = Math.min(8, miniMap.getLevel()+1);
    miniMap.setLevel(nextLevel);
  });

  miniMapFullscreenBtn.addEventListener('click',()=>{
    setMiniMapFullscreen(true);
  });

  miniMapCloseBtn.addEventListener('click',()=>{
    setMiniMapFullscreen(false);
  });

  mapTargetBtn.addEventListener('click', openTargetMap);
  targetMapClose.addEventListener('click', closeTargetMap);
  targetMapConfirm.addEventListener('click', applyPendingUserPosition);

  window.addEventListener('keydown',e=>{
    if(e.key === 'Escape' && miniMapShell.classList.contains('fullscreen')){
      setMiniMapFullscreen(false);
    }
  });

  window.addEventListener('resize',()=>{
    lastRouteLengthTs = null;
    positionSensorToast();
    if(!rafId) renderRoute(performance.now());
  });

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      lastRouteLengthTs = null;
      if(miniMapShell.classList.contains('fullscreen')){
        refreshMiniMapLayout();
      }
    });
    window.visualViewport.addEventListener('scroll',()=>{
      if(miniMapShell.classList.contains('fullscreen')){
        sizeMiniMapForCurrentMode();
      }
    });
  }

  installMiniMapScreenDrag();
  setControlsVisible(true);
  setMiniMapVisible(true);
  requestAnimationFrame(positionSensorToast);
  ensureMiniMap();

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeBottomSkirt.setAttribute('d','');
  routeRim.setAttribute('d','');
  routeEndBorder.setAttribute('d','');
  routeEndPulse.style.display = 'none';
  routeEndHalo.style.display = 'none';
  routeEndDot.style.display = 'none';
  updateTargetUi();
})();
</script>
</body>
</html>
